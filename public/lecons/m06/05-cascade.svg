ext x="517" y="195.2" class="mono rtext" font-size="10" text-anchor="middle">-2 334</text><rect x="578" y="209.1" width="46" height="42.9" fill="#2F6B47"/><text x="601" y="270" class="mono t3" font-size="10" text-anchor="middle">Marge sept.</text><rect x="24" y="296" width="330" height="92" rx="6" class="carte"/><rect x="24" y="296" width="330" height="92" rx="6" class="bord"/><text x="44" y="322" class="h" font-size="13.5">Ce que ça remplace</text><text x="44" y="346" class="p" font-size="12.5">Un tableau de huit lignes que personne</text><text x="44" y="366" class="p" font-size="12.5">ne lit, et une phrase d&#x27;explication.</text><rect x="374" y="296" width="306" height="92" rx="6" class="vfill"/><rect x="374" y="296" width="306" height="92" rx="6" class="bord"/><text x="394" y="322" class="h" font-size="13.5">La seule entorse autorisée</text><text x="394" y="346" class="p" font-size="12.5">L&#x27;axe ne part pas de zéro — et c&#x27;est</text><text x="394" y="366" class="p" font-size="12.5">juste : ces barres sont des écarts.</text></svg>