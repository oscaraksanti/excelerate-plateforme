<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 436" width="704" height="436" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="436" rx="8" class="fond"/><text x="24" y="30" class="eti">Un tableau de bord tient en quatre questions</text><rect x="24" y="54" width="316" height="112" rx="6" class="carte"/><rect x="24" y="54" width="316" height="112" rx="6" class="bord"/><text x="44" y="80" class="eti" font-size="10.5">VALEUR</text><text x="44" y="102" class="p" font-size="12.5">Où en est-on ?</text><text x="44" y="134" class="mono t" font-size="22" font-weight="600">2,30 M USD</text><text x="44" y="154" class="mono t3" font-size="10.5">le chiffre nu, sans contexte</text><rect x="364" y="54" width="316" height="112" rx="6" class="carte"/><rect x="364" y="54" width="316" height="112" rx="6" class="bord"/><text x="384" y="80" class="eti" font-size="10.5">COMPARAISON</text><text x="384" y="102" class="p" font-size="12.5">Par rapport à quoi ?</text><text x="384" y="134" class="mono vtext" font-size="22" font-weight="600">98,5 %</text><text x="384" y="154" class="mono t3" font-size="10.5">de l&#x27;objectif — c&#x27;est ça qui fait sens</text><rect x="24" y="184" width="316" height="112" rx="6" class="carte"/><rect x="24" y="184" width="316" height="112" rx="6" class="bord"/><text x="44" y="210" class="eti" font-size="10.5">TENDANCE</text><text x="44" y="232" class="p" font-size="12.5">Dans quel sens ?</text><text x="44" y="264" class="mono rtext" font-size="22" font-weight="600">−9,8 %</text><text x="44" y="284" class="mono t3" font-size="10.5">sur un mois</text><rect x="364" y="184" width="316" height="112" rx="6" class="vfill"/><rect x="364" y="184" width="316" height="112" rx="6" class="bord"/><text x="384" y="210" class="eti" font-size="10.5">EXCEPTION</text><text x="384" y="232" class="p" font-size="12.5">Qu&#x27;est-ce qui cloche ?</text><text x="384" y="264" class="mono rtext" font-size="22" font-weight="600">Lubumbashi</text><text x="384" y="284" class="mono t3" font-size="10.5">−51 503 USD sous son objectif</text><rect x="24" y="322" width="656" height="96" rx="6" class="carte"/><rect x="24" y="322" width="656" height="96" rx="6" class="bord"/><text x="44" y="348" class="h" font-size="13.5">Pourquoi quatre et pas quatorze</text><text x="44" y="372" class="p" font-size="12.5">Quatorze indicateurs de même taille ne hiérarchisent rien : l&#x27;œil ne sait pas où aller.</text><text x="44" y="394" class="mono vtext" font-size="11.5">Le quatrième — l&#x27;exception — est celui que presque aucun rapport ne contient.</text></svg>