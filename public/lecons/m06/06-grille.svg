" fill="var(--f)" text-anchor="middle" font-weight="600">4</text><text x="402" y="223.0" class="eti" font-size="10.5">LE DÉTAIL QUI LA JUSTIFIE</text><text x="402" y="241.0" class="p" font-size="12">six lignes, des barres de données</text><rect x="44" y="268" width="616" height="54" rx="4" class="carte"/><rect x="44" y="268" width="616" height="54" rx="4" class="bord"/><circle cx="64" cy="295.0" r="11" fill="var(--vb)"/><text x="64" y="299.0" class="mono" font-size="11" fill="var(--f)" text-anchor="middle" font-weight="600">5</text><text x="86" y="292.0" class="eti" font-size="10.5">LA TENDANCE</text><text x="86" y="310.0" class="p" font-size="12">douze mois, une courbe, pas de quadrillage</text><rect x="24" y="356" width="656" height="86" rx="6" class="rfill"/><rect x="24" y="356" width="656" height="86" rx="6" class="bord"/><text x="44" y="382" class="h" font-size="13.5">Le test des huit secondes</text><text x="44" y="406" class="p" font-size="12.5">Ouvrir. Regarder huit secondes. Fermer. « Quelle agence est en difficulté ? »</text><text x="44" y="428" class="mono rtext" font-size="11.5">Si la personne hésite, ce n&#x27;est pas elle qui a mal lu.</text></svg>