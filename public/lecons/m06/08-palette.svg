<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 458" width="704" height="458" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="458" rx="8" class="fond"/><text x="24" y="30" class="eti">Ce que voit une personne sur douze dans la salle</text><rect x="24" y="54" width="656" height="128" rx="6" class="rfill"/><rect x="24" y="54" width="656" height="128" rx="6" class="bord"/><text x="44" y="82" class="h" font-size="14">Rouge / vert</text><text x="44" y="104" class="p" font-size="12">en deutéranopie, et à l&#x27;impression, les deux deviennent le même brun</text><rect x="44" y="118" width="96" height="42" rx="4" fill="#C0392B"/><text x="92" y="174" class="mono t3" font-size="10" text-anchor="middle">au-dessus</text><rect x="156" y="118" width="96" height="42" rx="4" fill="#2F6B47"/><text x="204" y="174" class="mono t3" font-size="10" text-anchor="middle">en dessous</text><text x="292" y="134" class="mono t3" font-size="10">ce que voit</text><text x="292" y="150" class="mono t3" font-size="10">un deutéranope :</text><rect x="400" y="118" width="96" height="42" rx="4" fill="#7E6B5A"/><rect x="512" y="118" width="96" height="42" rx="4" fill="#6E6B5E"/><rect x="24" y="202" width="656" height="128" rx="6" class="vfill"/><rect x="24" y="202" width="656" height="128" rx="6" class="bord"/><text x="44" y="230" class="h" font-size="14">Bleu / orange</text><text x="44" y="252" class="p" font-size="12">restent distincts en daltonisme comme en noir et blanc</text><rect x="44" y="266" width="96" height="42" rx="4" fill="#2B6CB0"/><text x="92" y="322" class="mono t3" font-size="10" text-anchor="middle">au-dessus</text><rect x="156" y="266" width="96" height="42" rx="4" fill="#DD6B20"/><text x="204" y="322" class="mono t3" font-size="10" text-anchor="middle">en dessous</text><text x="292" y="282" class="mono t3" font-size="10">ce que voit</text><text x="292" y="298" class="mono t3" font-size="10">un deutéranope :</text><rect x="400" y="266" width="96" height="42" rx="4" fill="#4A6FA5"/><rect x="512" y="266" width="96" height="42" rx="4" fill="#9A8B4F"/><rect x="24" y="350" width="656" height="92" rx="6" class="carte"/><rect x="24" y="350" width="656" height="92" rx="6" class="bord"/><text x="44" y="376" class="h" font-size="13.5">Le test qui tient en un geste</text><text x="44" y="400" class="p" font-size="12.5">Imprimez la page en noir et blanc. Si les deux couleurs deviennent le même gris,</text><text x="44" y="420" class="p" font-size="12.5">elles ne codent plus rien — et une réunion sur deux se tient sur un document imprimé.</text></svg>