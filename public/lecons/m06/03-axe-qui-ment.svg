<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 414" width="704" height="414" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="414" rx="8" class="fond"/><text x="24" y="30" class="eti">Les six mêmes mois, deux axes, deux conclusions</text><rect x="24" y="50" width="306" height="238" rx="6" class="vfill"/><rect x="24" y="50" width="306" height="238" rx="6" class="bord"/><text x="44" y="76" class="h" font-size="13">Axe à zéro — six mois très stables</text><line x1="70" y1="236" x2="310" y2="236" class="bord"/><line x1="70" y1="96" x2="70" y2="236" class="bord"/><rect x="78" y="116.3" width="24" height="119.7" fill="#4A7EBB"/><text x="90" y="252" class="mono t3" font-size="9.5" text-anchor="middle">avr</text><rect x="116" y="117.1" width="24" height="118.9" fill="#4A7EBB"/><text x="128" y="252" class="mono t3" font-size="9.5" text-anchor="middle">mai</text><rect x="154" y="122.0" width="24" height="114.0" fill="#4A7EBB"/><text x="166" y="252" class="mono t3" font-size="9.5" text-anchor="middle">juin</text><rect x="192" y="118.9" width="24" height="117.1" fill="#4A7EBB"/><text x="204" y="252" class="mono t3" font-size="9.5" text-anchor="middle">juil</text><rect x="230" y="108.6" width="24" height="127.4" fill="#4A7EBB"/><text x="242" y="252" class="mono t3" font-size="9.5" text-anchor="middle">août</text><rect x="268" y="121.0" width="24" height="115.0" fill="#4A7EBB"/><text x="280" y="252" class="mono t3" font-size="9.5" text-anchor="middle">sept</text><text x="44" y="268" class="mono t3" font-size="10.5">l’axe part de zéro</text><rect x="374" y="50" width="306" height="238" rx="6" class="rfill"/><rect x="374" y="50" width="306" height="238" rx="6" class="bord"/><text x="394" y="76" class="h" font-size="13">Axe à 2,2 M — la chute de septembre</text><line x1="420" y1="236" x2="660" y2="236" class="bord"/><line x1="420" y1="96" x2="420" y2="236" class="bord"/><rect x="428" y="167.9" width="24" height="68.1" fill="#4A7EBB"/><text x="440" y="252" class="mono t3" font-size="9.5" text-anchor="middle">avr</text><rect x="466" y="173.9" width="24" height="62.1" fill="#4A7EBB"/><text x="478" y="252" class="mono t3" font-size="9.5" text-anchor="middle">mai</text><rect x="504" y="207.8" width="24" height="28.2" fill="#4A7EBB"/><text x="516" y="252" class="mono t3" font-size="9.5" text-anchor="middle">juin</text><rect x="542" y="186.2" width="24" height="49.8" fill="#4A7EBB"/><text x="554" y="252" class="mono t3" font-size="9.5" text-anchor="middle">juil</text><rect x="580" y="113.9" width="24" height="122.1" fill="#4A7EBB"/><text x="592" y="252" class="mono t3" font-size="9.5" text-anchor="middle">août</text><rect x="618" y="201.3" width="24" height="34.7" fill="#C0392B"/><text x="630" y="252" class="mono t3" font-size="9.5" text-anchor="middle">sept</text><text x="394" y="268" class="mono t3" font-size="10.5">l’axe part de 2 200 000</text><rect x="24" y="304" width="656" height="92" rx="6" class="vfill"/><rect x="24" y="304" width="656" height="92" rx="6" class="bord"/><text x="44" y="330" class="h" font-size="13.5">Le même chiffre : −9,8 %</text><text x="44" y="354" class="p" font-size="12.5">À gauche, un creux. À droite, un effondrement. Aucun des deux graphiques n&#x27;est faux.</text><text x="44" y="376" class="mono vtext" font-size="11.5">Un axe tronqué se signale — ou ne se fait pas. La seule exception est la cascade.</text></svg>