</style><rect width="704" height="550" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">Douze livrables — un par compétence du programme</text><rect x="24" y="52" width="320" height="52" rx="6" class="carte"/><rect x="24" y="52" width="320" height="52" rx="6" class="bord"/><circle cx="50" cy="78" r="12" class="vfill"/><circle cx="50" cy="78" r="12" class="vstroke"/><text x="50" y="82" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">1</text><text x="72" y="76" class="h" font-size="12">Import Power Query des 21 sources</text><text x="72" y="94" class="mono t3" font-size="10">M7</text><rect x="360" y="52" width="320" height="52" rx="6" class="carte"/><rect x="360" y="52" width="320" height="52" rx="6" class="bord"/><circle cx="386" cy="78" r="12" class="vfill"/><circle cx="386" cy="78" r="12" class="vstroke"/><text x="386" y="82" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">2</text><text x="408" y="76" class="h" font-size="12">Nettoyage documenté, dans l&#x27;ordre</text><text x="408" y="94" class="mono t3" font-size="10">M3</text><rect x="24" y="114" width="320" height="52" rx="6" class="carte"/><rect x="24" y="114" width="320" height="52" rx="6" class="bord"/><circle cx="50" cy="140" r="12" class="vfill"/><circle cx="50" cy="140" r="12" class="vstroke"/><text x="50" y="144" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">3</text><text x="72" y="138" class="h" font-size="12">Modèle en étoile + calendrier</text><text x="72" y="156" class="mono t3" font-size="10">M8</text><rect x="360" y="114" width="320" height="52" rx="6" class="carte"/><rect x="360" y="114" width="320" height="52" rx="6" class="bord"/><circle cx="386" cy="140" r="12" class="vfill"/><circle cx="386" cy="140" r="12" class="vstroke"/><text x="386" y="144" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">4</text><text x="408" y="138" class="h" font-size="12">Dix mesures en français métier</text><text x="408" y="156" class="mono t3" font-size="10">M8</text><rect x="24" y="176" width="320" height="52" rx="6" class="carte"/><rect x="24" y="176" width="320" height="52" rx="6" class="bord"/><circle cx="50" cy="202" r="12" class="vfill"/><circle cx="50" cy="202" r="12" class="vstroke"/><text x="50" y="206" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">5</text><text x="72" y="200" class="h" font-size="12">Réconciliation, quatre familles</text><text x="72" y="218" class="mono t3" font-size="10">M4</text><rect x="360" y="176" width="320" height="52" rx="6" class="carte"/><rect x="360" y="176" width="320" height="52" rx="6" class="bord"/><circle cx="386" cy="202" r="12" class="vfill"/><circle cx="386" cy="202" r="12" class="vstroke"/><text x="386" y="206" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">6</text><text x="408" y="200" class="h" font-size="12">Tableau de bord d&#x27;une page</text><text x="408" y="218" class="mono t3" font-size="10">M6</text><rect x="24" y="238" width="320" height="52" rx="6" class="carte"/><rect x="24" y="238" width="320" height="52" rx="6" class="bord"/><circle cx="50" cy="264" r="12" class="vfill"/><circle cx="50" cy="264" r="12" class="vstroke"/><text x="50" y="268" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">7</text><text x="72" y="262" class="h" font-size="12">Scénarios, table à deux entrées</text><text x="72" y="280" class="mono t3" font-size="10">M9</text><rect x="360" y="238" width="320" height="52" rx="6" class="carte"/><rect x="360" y="238" width="320" height="52" rx="6" class="bord"/><circle cx="386" cy="264" r="12" class="vfill"/><circle cx="386" cy="264" r="12" class="vstroke"/><text x="386" y="268" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">8</text><text x="408" y="262" class="h" font-size="12">Automatisation qui rejoue tout</text><text x="408" y="280" class="mono t3" font-size="10">M10</text><rect x="24" y="300" width="320" height="52" rx="6" class="carte"/><rect x="24" y="300" width="320" height="52" rx="6" class="bord"/><circle cx="50" cy="326" r="12" class="vfill"/><circle cx="50" cy="326" r="12" class="vstroke"/><text x="50" y="330" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">9</text><text x="72" y="324" class="h" font-size="12">README complet</text><text x="72" y="342" class="mono t3" font-size="10">M9</text><rect x="360" y="300" width="320" height="52" rx="6" class="carte"/><rect x="360" y="300" width="320" height="52" rx="6" class="bord"/><circle cx="386" cy="326" r="12" class="vfill"/><circle cx="386" cy="326" r="12" class="vstroke"/><text x="386" y="330" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">10</text><text x="408" y="324" class="h" font-size="12">QUALITE — dix contrôles</text><text x="408" y="342" class="mono t3" font-size="10">M2</text><rect x="24" y="362" width="320" height="52" rx="6" class="carte"/><rect x="24" y="362" width="320" height="52" rx="6" class="bord"/><circle cx="50" cy="388" r="12" class="vfill"/><circle cx="50" cy="388" r="12" class="vstroke"/><text x="50" y="392" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">11</text><text x="72" y="386" class="h" font-size="12">ANNEXE_IA — trois erreurs d&#x27;IA</text><text x="72" y="404" class="mono t3" font-size="10">tous</text><rect x="360" y="362" width="320" height="52" rx="6" class="carte"/><rect x="360" y="362" width="320" height="52" rx="6" class="bord"/><circle cx="386" cy="388" r="12" class="vfill"/><circle cx="386" cy="388" r="12" class="vstroke"/><text x="386" y="392" class="vtext mono" font-size="11" font-weight="600" text-anchor="middle">12</text><text x="408" y="386" class="h" font-size="12">Note de synthèse d&#x27;une page</text><text x="408" y="404" class="mono t3" font-size="10">M6</text><rect x="24" y="432" width="656" height="86" rx="6" class="vfill"/><rect x="24" y="432" width="656" height="86" rx="6" class="bord"/><text x="44" y="460" class="h" font-size="14.5">Et la condition qui compte plus que les douze</text><text x="44" y="486" class="p" font-size="12.5">Vous devez pouvoir expliquer CHAQUE élément de votre fichier. Chaque formule, chaque</text><text x="44" y="506" class="p" font-size="12.5">relation, chaque mesure, chaque étape de requête. Jamais « c&#x27;est Claude qui l&#x27;a fait ».</text></svg>