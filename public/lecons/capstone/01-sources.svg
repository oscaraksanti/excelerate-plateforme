<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 740" width="704" height="740" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="740" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">Vingt et un fichiers, et aucun au même format</text><rect x="24" y="52" width="656" height="110" rx="6" class="vfill"/><rect x="24" y="52" width="656" height="110" rx="6" class="bord"/><text x="44" y="76" class="h" font-size="13.5">4 classeurs de ventes</text><text x="300" y="76" class="mono t3" font-size="10.5">V01 à V04</text><text x="440" y="76" class="p" font-size="11.5">· un standard</text><text x="440" y="96" class="p" font-size="11.5">· un avec titre et ligne vide</text><text x="440" y="116" class="p" font-size="11.5">· un aux colonnes réordonnées</text><text x="440" y="136" class="p" font-size="11.5">· un avec une colonne en plus</text><rect x="24" y="172" width="656" height="90" rx="6" class="carte"/><rect x="24" y="172" width="656" height="90" rx="6" class="bord"/><text x="44" y="196" class="h" font-size="13.5">3 classeurs de stocks</text><text x="300" y="196" class="mono t3" font-size="10.5">S01 à S03</text><text x="440" y="196" class="p" font-size="11.5">· croisés : les mois en colonnes</text><text x="440" y="216" class="p" font-size="11.5">· un en ordre inverse</text><text x="440" y="236" class="p" font-size="11.5">· un avec un titre au-dessus</text><rect x="24" y="272" width="656" height="90" rx="6" class="carte"/><rect x="24" y="272" width="656" height="90" rx="6" class="bord"/><text x="44" y="296" class="h" font-size="13.5">6 référentiels et budgets</text><text x="300" y="296" class="mono t3" font-size="10.5">R01 à R04 · B01 · B02</text><text x="440" y="296" class="p" font-size="11.5">· produits, clients, agences</text><text x="440" y="316" class="p" font-size="11.5">· taux de change mensuels</text><text x="440" y="336" class="p" font-size="11.5">· budget croisé, objectifs</text><rect x="24" y="372" width="656" height="70" rx="6" class="carte"/><rect x="24" y="372" width="656" height="70" rx="6" class="bord"/><text x="44" y="396" class="h" font-size="13.5">2 autres classeurs</text><text x="300" y="396" class="mono t3" font-size="10.5">C01 · H01</text><text x="440" y="396" class="p" font-size="11.5">· charges en devise locale</text><text x="440" y="416" class="p" font-size="11.5">· exercice N-1, déjà en USD</text><rect x="24" y="452" width="656" height="90" rx="6" class="rfill"/><rect x="24" y="452" width="656" height="90" rx="6" class="bord"/><text x="44" y="476" class="h" font-size="13.5">5 exports comptables</text><text x="300" y="476" class="mono t3" font-size="10.5">CPT_*.csv</text><text x="440" y="476" class="p" font-size="11.5">· cp1252, séparateur point-virgule</text><text x="440" y="496" class="p" font-size="11.5">· utf-8 avec BOM, dates ISO</text><text x="440" y="516" class="p" font-size="11.5">· dates au format américain</text><rect x="24" y="552" width="656" height="70" rx="6" class="rfill"/><rect x="24" y="552" width="656" height="70" rx="6" class="bord"/><text x="44" y="576" class="h" font-size="13.5">1 facture scannée</text><text x="300" y="576" class="mono t3" font-size="10.5">F01</text><text x="440" y="576" class="p" font-size="11.5">· photographiée de travers</text><text x="440" y="596" class="p" font-size="11.5">· le total imprimé est le contrôle</text><rect x="24" y="632" width="656" height="76" rx="6" class="vfill"/><rect x="24" y="632" width="656" height="76" rx="6" class="bord"/><text x="44" y="658" class="h" font-size="13.5">Ce qu&#x27;il y a dedans</text><text x="44" y="682" class="mono t2" font-size="11.5">26 637 lignes de vente  ·  9 464 factures  ·  9 465 écritures comptables  ·  600 clients</text><text x="44" y="700" class="mono t3" font-size="10.5">Exercice du 1er octobre 2025 au 30 septembre 2026  ·  six agences  ·  trois devises</text></svg>