<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="720" height="356" rx="8" class="fond"/><text x="24" y="30" class="eti">Une formule, une cellule, un tableau entier</text><text x="24" y="60" class="p">On écrit la formule ici, et seulement ici :</text><rect x="24" y="76" width="300" height="30" rx="4" class="carte"/><rect x="24" y="76" width="300" height="30" rx="4" class="vstroke" stroke-width="2"/><text x="36" y="96" class="mono t" font-size="12">=TRIER(UNIQUE(t_Caisse[Client]))</text><path d="M 174 112 L 174 132" class="vstroke" stroke-width="2"/><path d="M 168 126 L 174 134 L 180 126" class="vstroke" stroke-width="2"/><rect x="24" y="142" width="300" height="156" rx="3" class="carte"/><line x1="24" y1="142" x2="324" y2="142" class="bord2"/><line x1="24" y1="168" x2="324" y2="168" class="bord2"/><line x1="24" y1="194" x2="324" y2="194" class="bord2"/><line x1="24" y1="220" x2="324" y2="220" class="bord2"/><line x1="24" y1="246" x2="324" y2="246" class="bord2"/><line x1="24" y1="272" x2="324" y2="272" class="bord2"/><line x1="24" y1="298" x2="324" y2="298" class="bord2"/><line x1="24" y1="142" x2="24" y2="298" class="bord2"/><line x1="324" y1="142" x2="324" y2="298" class="bord2"/><rect x="24" y="142" width="300" height="156" class="vstroke" stroke-width="2" rx="2"/><text x="33" y="159.0" class="mono t" font-size="11">ALIMENTATION BANDAL</text><text x="33" y="185.0" class="mono t" font-size="11">BOUTIQUE MAMA NGALULA</text><text x="33" y="211.0" class="mono t" font-size="11">CANTINE UNIKIN</text><text x="33" y="237.0" class="mono t" font-size="11">DEPOT KINTAMBO</text><text x="33" y="263.0" class="mono t" font-size="11">EPICERIE LEMBA</text><text x="33" y="289.0" class="mono t" font-size="11">GROSSISTE MASINA</text><rect x="24" y="142" width="300" height="156" rx="3" class="bord"/><text x="24" y="330" class="mono" font-size="11" fill="var(--t3)">le cadre bleu = la plage de déversement</text><line x1="356" y1="46" x2="356" y2="340" class="bord2"/><text x="388" y="66" class="h" font-size="14">Les deux règles</text><rect x="388" y="82" width="308" height="76" rx="5" class="rfill"/><text x="404" y="106" class="mono rtext" font-size="12.5">#DEBORDEMENT!</text><text x="404" y="128" class="p" font-size="12">Une seule cause : quelque chose</text><text x="404" y="146" class="p" font-size="12">occupe la place. Videz, ça repart.</text><rect x="388" y="176" width="308" height="76" rx="5" class="vfill"/><text x="404" y="200" class="mono vtext" font-size="12.5">E2#</text><text x="404" y="222" class="p" font-size="12">« tout ce que cette formule a</text><text x="404" y="240" class="p" font-size="12">déversé » — même si ça grandit.</text><text x="388" y="284" class="p" font-size="12">On ne recopie jamais une formule</text><text x="388" y="302" class="p" font-size="12">de déversement vers le bas :</text><text x="388" y="320" class="p" font-size="12">elle se déverse déjà toute seule.</text></svg>