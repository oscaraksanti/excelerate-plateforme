</style><rect width="720" height="404" rx="8" class="fond"/><text x="24" y="30" class="eti">Les six arguments — les trois derniers sont facultatifs</text><rect x="24" y="48" width="672" height="52" rx="5" class="carte"/><rect x="24" y="48" width="672" height="52" rx="5" class="bord"/><text x="36" y="80" class="mono t3" font-size="14" font-weight="400">=RECHERCHEX(</text><text x="132" y="80" class="mono t" font-size="14" font-weight="400">valeur</text><text x="190" y="80" class="mono t3" font-size="14" font-weight="400"> ; </text><text x="212" y="80" class="mono t" font-size="14" font-weight="400">où chercher</text><text x="306" y="80" class="mono t3" font-size="14" font-weight="400"> ; </text><text x="328" y="80" class="mono t" font-size="14" font-weight="400">quoi renvoyer</text><text x="438" y="80" class="mono t3" font-size="14" font-weight="400"> ; </text><text x="460" y="80" class="mono t2" font-size="14" font-weight="400">si absent</text><text x="536" y="80" class="mono t3" font-size="14" font-weight="400"> ; </text><text x="558" y="80" class="mono t2" font-size="14" font-weight="400">0</text><text x="572" y="80" class="mono t3" font-size="14" font-weight="400"> ; </text><text x="594" y="80" class="mono vtext" font-size="14" font-weight="600">-1</text><text x="616" y="80" class="mono t3" font-size="14" font-weight="400">)</text><text x="40" y="122" class="mono" font-size="12" fill="var(--t3)" font-weight="400">valeur</text><text x="172" y="122" class="p" font-size="12.5">ce qu'on cherche</text><line x1="24" y1="131" x2="696" y2="131" class="bord2"/><text x="40" y="148" class="mono" font-size="12" fill="var(--t3)" font-weight="400">où chercher</text><text x="172" y="148" class="p" font-size="12.5">la colonne des clés</text><line x1="24" y1="157" x2="696" y2="157" class="bord2"/><text x="40" y="174" class="mono" font-size="12" fill="var(--t3)" font-weight="400">quoi renvoyer</text><text x="172" y="174" class="p" font-size="12.5">la colonne du résultat</text><line x1="24" y1="183" x2="696" y2="183" class="bord2"/><text x="40" y="200" class="mono" font-size="12" fill="var(--t3)" font-weight="400">si absent</text><text x="172" y="200" class="p" font-size="12.5">ce qu'on affiche au lieu de #N/A</text><line x1="24" y1="209" x2="696" y2="209" class="bord2"/><text x="40" y="226" class="mono" font-size="12" fill="var(--t3)" font-weight="400">0</text><text x="172" y="226" class="p" font-size="12.5">correspondance exacte</text><line x1="24" y1="235" x2="696" y2="235" class="bord2"/><text x="40" y="252" class="mono" font-size="12" fill="var(--v)" font-weight="600">-1</text><text x="172" y="252" class="p" font-size="12.5">on cherche de bas en haut</text><line x1="24" y1="261" x2="696" y2="261" class="bord2"/><rect x="586" y="52" width="46" height="44" rx="4" class="vstroke" stroke-width="2"/><rect x="24" y="288" width="672" height="92" rx="5" class="vfill"/><text x="42" y="314" class="h" font-size="14" fill="var(--v)">Le sixième argument est la pépite</text><text x="42" y="338" class="p" font-size="12.5">Sans lui, on trouve le PREMIER prix appliqué au client.</text><text x="42" y="358" class="p" font-size="12.5">Avec -1, on cherche de bas en haut : on trouve le DERNIER.</text><text x="42" y="378" class="mono" font-size="11.5" fill="var(--t3)">SUPERMARCHE CITY : premier 38 400 CDF · dernier 36 800 CDF</text></svg>