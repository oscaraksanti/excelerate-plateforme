<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 454" width="720" height="454" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="720" height="454" rx="8" class="fond"/><text x="24" y="30" class="eti">Les cinq blocs d'un prompt qui marche du premier coup</text><rect x="24" y="50" width="672" height="66" rx="6" class="carte"/><rect x="24" y="50" width="672" height="66" rx="6" class="bord" stroke-width="1"/><text x="46" y="90" class="mono" font-size="26" font-weight="600" fill="var(--t3)">C</text><text x="86" y="76" class="h" font-size="14">Contexte</text><text x="86" y="94" class="p" font-size="12">Qui vous êtes, quel métier, quel enjeu.</text><text x="86" y="110" class="mono t3" font-size="11">« Contrôleur de gestion, distributeur, 6 agences, 3 devises. »</text><rect x="24" y="124" width="672" height="66" rx="6" class="carte"/><rect x="24" y="124" width="672" height="66" rx="6" class="bord" stroke-width="1"/><text x="46" y="164" class="mono" font-size="26" font-weight="600" fill="var(--t3)">L</text><text x="86" y="150" class="h" font-size="14">Logique</text><text x="86" y="168" class="p" font-size="12">Ce que vous voulez obtenir, en français.</text><text x="86" y="184" class="mono t3" font-size="11">« Le taux du mois de la vente, puis le montant en USD. »</text><rect x="24" y="198" width="672" height="66" rx="6" class="vfill"/><rect x="24" y="198" width="672" height="66" rx="6" class="vstroke" stroke-width="2"/><text x="46" y="238" class="mono" font-size="26" font-weight="600" fill="var(--v)">E</text><text x="86" y="224" class="h" font-size="14">Environnement</text><text x="86" y="242" class="p" font-size="12">Votre version, vos séparateurs, vos tableaux.</text><text x="86" y="258" class="mono t3" font-size="11">« Excel 2024 français, séparateur ; décimale , — tableau t_Caisse. »</text><rect x="24" y="272" width="672" height="66" rx="6" class="carte"/><rect x="24" y="272" width="672" height="66" rx="6" class="bord" stroke-width="1"/><text x="46" y="312" class="mono" font-size="26" font-weight="600" fill="var(--t3)">A</text><text x="86" y="298" class="h" font-size="14">Action</text><text x="86" y="316" class="p" font-size="12">La forme exacte de la réponse attendue.</text><text x="86" y="332" class="mono t3" font-size="11">« La formule en français ET en anglais, plus deux lignes d'explication. »</text><rect x="24" y="346" width="672" height="66" rx="6" class="carte"/><rect x="24" y="346" width="672" height="66" rx="6" class="bord" stroke-width="1"/><text x="46" y="386" class="mono" font-size="26" font-weight="600" fill="var(--t3)">R</text><text x="86" y="372" class="h" font-size="14">Revue</text><text x="86" y="390" class="p" font-size="12">De quoi vérifier sans faire confiance.</text><text x="86" y="406" class="mono t3" font-size="11">« Trois cas de test avec le résultat attendu, dont un cas limite. »</text><text x="24" y="438" class="p" font-size="12.5">Le bloc E est celui que personne n'écrit. Il cause 70 % des formules inutilisables.</text></svg>