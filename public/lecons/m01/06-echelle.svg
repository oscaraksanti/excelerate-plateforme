<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="720" height="384" rx="8" class="fond"/><text x="24" y="30" class="eti">Les huit niveaux — vous êtes au bout du premier soir</text><rect x="24" y="48" width="672" height="34" rx="4" class="vfill"/><rect x="24" y="48" width="672" height="34" rx="4" class="bord" stroke-width="1"/><text x="44" y="70" class="mono" font-size="12" fill="var(--v)">1</text><text x="72" y="70" class="h" font-size="13" >Je le fais à la main</text><rect x="24" y="86" width="672" height="34" rx="4" class="vfill"/><rect x="24" y="86" width="672" height="34" rx="4" class="bord" stroke-width="1"/><text x="44" y="108" class="mono" font-size="12" fill="var(--v)">2</text><text x="72" y="108" class="h" font-size="13" >Je le fais avec une formule</text><rect x="24" y="124" width="672" height="34" rx="4" class="vfill"/><rect x="24" y="124" width="672" height="34" rx="4" class="vstroke" stroke-width="2"/><text x="44" y="146" class="mono" font-size="12" fill="var(--v)">3</text><text x="72" y="146" class="h" font-size="13" >Je rends la formule dynamique</text><text x="676" y="146" text-anchor="end" class="mono vtext" font-size="10.5" letter-spacing=".1em">CE SOIR</text><rect x="24" y="162" width="672" height="34" rx="4" class="carte"/><rect x="24" y="162" width="672" height="34" rx="4" class="bord" stroke-width="1"/><text x="44" y="184" class="mono" font-size="12" fill="var(--t3)">4</text><text x="72" y="184" class="h" font-size="13" fill="var(--t2)">J'automatise dans Excel</text><rect x="24" y="200" width="672" height="34" rx="4" class="carte"/><rect x="24" y="200" width="672" height="34" rx="4" class="bord" stroke-width="1"/><text x="44" y="222" class="mono" font-size="12" fill="var(--t3)">5</text><text x="72" y="222" class="h" font-size="13" fill="var(--t2)">J'industrialise</text><rect x="24" y="238" width="672" height="34" rx="4" class="vfill"/><rect x="24" y="238" width="672" height="34" rx="4" class="vstroke" stroke-width="2"/><text x="44" y="260" class="mono" font-size="12" fill="var(--v)">6</text><text x="72" y="260" class="h" font-size="13" >Je fais raisonner l'IA avec moi</text><text x="676" y="260" text-anchor="end" class="mono vtext" font-size="10.5" letter-spacing=".1em">CE SOIR</text><rect x="24" y="276" width="672" height="34" rx="4" class="carte"/><rect x="24" y="276" width="672" height="34" rx="4" class="bord" stroke-width="1"/><text x="44" y="298" class="mono" font-size="12" fill="var(--t3)">7</text><text x="72" y="298" class="h" font-size="13" fill="var(--t2)">Le flux complet tourne seul</text><rect x="24" y="314" width="672" height="34" rx="4" class="carte"/><rect x="24" y="314" width="672" height="34" rx="4" class="bord" stroke-width="1"/><text x="44" y="336" class="mono" font-size="12" fill="var(--t3)">8</text><text x="72" y="336" class="h" font-size="13" fill="var(--t2)">Je contrôle, je valide, j'assume</text><text x="24" y="368" class="p" font-size="12.5">Le niveau 8 n'est pas au-dessus de l'IA : il en est la condition.</text></svg>