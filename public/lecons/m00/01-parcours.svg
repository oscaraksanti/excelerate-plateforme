</style><rect width="704" height="588" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">D’où vous partez, et où vous arrivez</text><rect x="24" y="52" width="656" height="74" rx="6" class="vfill"/><rect x="24" y="52" width="656" height="74" rx="6" class="bord"/><text x="44" y="80" class="h" font-size="14">Module 0</text><text x="44" y="102" class="p" font-size="12.5">Se préparer</text><text x="656" y="80" class="mono ok" font-size="11.5" text-anchor="end">gratuit</text><text x="240" y="102" class="mono t3" font-size="10.5">vous êtes ici</text><path d="M 352 126 L 352 136" stroke="var(--b)" stroke-width="2"/><rect x="24" y="136" width="656" height="74" rx="6" class="vfill"/><rect x="24" y="136" width="656" height="74" rx="6" class="bord"/><text x="44" y="164" class="h" font-size="14">Modules 1 → 3</text><text x="44" y="186" class="p" font-size="12.5">Les trois soirées</text><text x="656" y="164" class="mono ok" font-size="11.5" text-anchor="end">gratuit</text><text x="240" y="186" class="mono t3" font-size="10.5">structurer, l’IA comme copilote, automatiser</text><path d="M 352 210 L 352 220" stroke="var(--b)" stroke-width="2"/><rect x="24" y="220" width="656" height="74" rx="6" class="carte"/><rect x="24" y="220" width="656" height="74" rx="6" class="bord"/><text x="44" y="248" class="h" font-size="14">Modules 4 → 10</text><text x="44" y="270" class="p" font-size="12.5">La masterclass</text><text x="656" y="248" class="mono t2" font-size="11.5" text-anchor="end">37 $</text><text x="240" y="270" class="mono t3" font-size="10.5">croiser, TCD, tableaux de bord, Power Query, modèle, décider, livrer</text><path d="M 352 294 L 352 304" stroke="var(--b)" stroke-width="2"/><rect x="24" y="304" width="656" height="74" rx="6" class="carte"/><rect x="24" y="304" width="656" height="74" rx="6" class="bord"/><text x="44" y="332" class="h" font-size="14">Capstone</text><text x="44" y="354" class="p" font-size="12.5">Le projet final</text><text x="656" y="332" class="mono t2" font-size="11.5" text-anchor="end">37 $</text><text x="240" y="354" class="mono t3" font-size="10.5">21 fichiers, un brief de quatre phrases, et rien d’autre</text><path d="M 352 378 L 352 388" stroke="var(--b)" stroke-width="2"/><rect x="24" y="388" width="656" height="74" rx="6" class="vfill"/><rect x="24" y="388" width="656" height="74" rx="6" class="bord"/><text x="44" y="416" class="h" font-size="14">Certificat</text><text x="44" y="438" class="p" font-size="12.5">Excelerate IA — Avancé</text><text x="240" y="438" class="mono t3" font-size="10.5">vérifiable en ligne, avec son code unique</text><rect x="24" y="472" width="656" height="78" rx="6" class="carte"/><rect x="24" y="472" width="656" height="78" rx="6" class="bord"/><text x="44" y="500" class="h" font-size="13.5">Ce que vous emportez, quoi qu’il arrive</text><text x="44" y="524" class="p" font-size="12.5">Les trois premiers modules sont gratuits et le restent. Dix heures de fondations aussi.</text><text x="44" y="542" class="mono t3" font-size="11">Personne ne vous demandera votre carte pour commencer.</text></svg>