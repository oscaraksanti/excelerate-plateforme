<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 626" width="704" height="626" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="626" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">Comment un module se suit — comptez deux heures</text><rect x="24" y="52" width="656" height="66" rx="6" class="carte"/><rect x="24" y="52" width="656" height="66" rx="6" class="bord"/><circle cx="56" cy="85" r="15" class="vfill"/><circle cx="56" cy="85" r="15" class="vstroke"/><text x="56" y="90" class="vtext mono" font-size="13" font-weight="600" text-anchor="middle">1</text><text x="88" y="80" class="h" font-size="13.5">Les cinq leçons</text><text x="88" y="102" class="p" font-size="12">à lire ou à regarder, dans l’ordre</text><text x="656" y="80" class="mono t3" font-size="10.5" text-anchor="end">15 min chacune</text><path d="M 352 118 L 352 126" stroke="var(--b)" stroke-width="2"/><rect x="24" y="126" width="656" height="66" rx="6" class="carte"/><rect x="24" y="126" width="656" height="66" rx="6" class="bord"/><circle cx="56" cy="159" r="15" class="vfill"/><circle cx="56" cy="159" r="15" class="vstroke"/><text x="56" y="164" class="vtext mono" font-size="13" font-weight="600" text-anchor="middle">2</text><text x="88" y="154" class="h" font-size="13.5">Le QCM</text><text x="88" y="176" class="p" font-size="12">six ou sept questions, corrigées et expliquées sur-le-champ</text><text x="656" y="154" class="mono t3" font-size="10.5" text-anchor="end">5 min</text><path d="M 352 192 L 352 200" stroke="var(--b)" stroke-width="2"/><rect x="24" y="200" width="656" height="66" rx="6" class="carte"/><rect x="24" y="200" width="656" height="66" rx="6" class="bord"/><circle cx="56" cy="233" r="15" class="vfill"/><circle cx="56" cy="233" r="15" class="vstroke"/><text x="56" y="238" class="vtext mono" font-size="13" font-weight="600" text-anchor="middle">3</text><text x="88" y="228" class="h" font-size="13.5">Le travail pratique</text><text x="88" y="250" class="p" font-size="12">un classeur à trous : chaque réponse est une cellule</text><text x="656" y="228" class="mono t3" font-size="10.5" text-anchor="end">60 à 90 min</text><path d="M 352 266 L 352 274" stroke="var(--b)" stroke-width="2"/><rect x="24" y="274" width="656" height="66" rx="6" class="carte"/><rect x="24" y="274" width="656" height="66" rx="6" class="bord"/><circle cx="56" cy="307" r="15" class="vfill"/><circle cx="56" cy="307" r="15" class="vstroke"/><text x="56" y="312" class="vtext mono" font-size="13" font-weight="600" text-anchor="middle">4</text><text x="88" y="302" class="h" font-size="13.5">Le dépôt</text><text x="88" y="324" class="p" font-size="12">la note automatique s’affiche en quelques secondes</text><text x="656" y="302" class="mono t3" font-size="10.5" text-anchor="end">instantané</text><path d="M 352 340 L 352 348" stroke="var(--b)" stroke-width="2"/><rect x="24" y="348" width="656" height="66" rx="6" class="carte"/><rect x="24" y="348" width="656" height="66" rx="6" class="bord"/><circle cx="56" cy="381" r="15" class="vfill"/><circle cx="56" cy="381" r="15" class="vstroke"/><text x="56" y="386" class="vtext mono" font-size="13" font-weight="600" text-anchor="middle">5</text><text x="88" y="376" class="h" font-size="13.5">Trois corrections</text><text x="88" y="398" class="p" font-size="12">vous corrigez trois copies avant de voir votre note finale</text><text x="656" y="376" class="mono t3" font-size="10.5" text-anchor="end">15 min chacune</text><rect x="24" y="422" width="656" height="78" rx="6" class="vfill"/><rect x="24" y="422" width="656" height="78" rx="6" class="bord"/><text x="44" y="450" class="h" font-size="13.5">Pourquoi vous corrigez les autres</text><text x="44" y="476" class="p" font-size="12.5">Parce qu’on apprend plus en relisant trois copies qu’en recevant une note. Et parce que</text><text x="44" y="494" class="p" font-size="12.5">la moitié de ce qui compte — la lisibilité, la documentation — ne se note pas à la machine.</text><rect x="24" y="512" width="656" height="78" rx="6" class="carte"/><rect x="24" y="512" width="656" height="78" rx="6" class="bord"/><text x="44" y="540" class="h" font-size="13.5">Les directs</text><text x="44" y="566" class="p" font-size="12.5">Sur Teams, de 19 h à 21 h GMT — soit 20 h à 22 h à Kinshasa, Douala et Libreville,</text><text x="44" y="584" class="p" font-size="12.5">19 h à 21 h à Abidjan et Dakar. Le lien est sur votre tableau de bord.</text></svg>