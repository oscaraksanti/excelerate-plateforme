</style><rect width="704" height="562" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">Le fil rouge — une seule entreprise, du premier soir au certificat</text><rect x="232" y="52" width="240" height="82" rx="6" class="vfill"/><rect x="232" y="52" width="240" height="82" rx="6" class="bord"/><text x="352" y="82" class="h" font-size="15" text-anchor="middle">GROUPE BAOBAB</text><text x="352" y="104" class="p" font-size="12" text-anchor="middle">distribution de produits</text><text x="352" y="122" class="p" font-size="12" text-anchor="middle">de grande consommation</text><rect x="24" y="186" width="208" height="62" rx="6" class="carte"/><rect x="24" y="186" width="208" height="62" rx="6" class="bord"/><text x="128" y="214" class="h" font-size="13.5" text-anchor="middle">Kinshasa</text><text x="128" y="234" class="mono t3" font-size="11" text-anchor="middle">CDF</text><rect x="248" y="186" width="208" height="62" rx="6" class="carte"/><rect x="248" y="186" width="208" height="62" rx="6" class="bord"/><text x="352" y="214" class="h" font-size="13.5" text-anchor="middle">Lubumbashi</text><text x="352" y="234" class="mono t3" font-size="11" text-anchor="middle">CDF</text><rect x="472" y="186" width="208" height="62" rx="6" class="carte"/><rect x="472" y="186" width="208" height="62" rx="6" class="bord"/><text x="576" y="214" class="h" font-size="13.5" text-anchor="middle">Abidjan</text><text x="576" y="234" class="mono t3" font-size="11" text-anchor="middle">XOF</text><rect x="24" y="268" width="208" height="62" rx="6" class="carte"/><rect x="24" y="268" width="208" height="62" rx="6" class="bord"/><text x="128" y="296" class="h" font-size="13.5" text-anchor="middle">Dakar</text><text x="128" y="316" class="mono t3" font-size="11" text-anchor="middle">XOF</text><rect x="248" y="268" width="208" height="62" rx="6" class="carte"/><rect x="248" y="268" width="208" height="62" rx="6" class="bord"/><text x="352" y="296" class="h" font-size="13.5" text-anchor="middle">Douala</text><text x="352" y="316" class="mono t3" font-size="11" text-anchor="middle">XAF</text><rect x="472" y="268" width="208" height="62" rx="6" class="carte"/><rect x="472" y="268" width="208" height="62" rx="6" class="bord"/><text x="576" y="296" class="h" font-size="13.5" text-anchor="middle">Libreville</text><text x="576" y="316" class="mono t3" font-size="11" text-anchor="middle">XAF</text><path d="M 352 134 C 352 160, 128 160, 128 186" stroke="var(--vb)" stroke-width="1.5" fill="none"/><path d="M 352 134 C 352 160, 352 160, 352 186" stroke="var(--vb)" stroke-width="1.5" fill="none"/><path d="M 352 134 C 352 160, 576 160, 576 186" stroke="var(--vb)" stroke-width="1.5" fill="none"/><rect x="24" y="346" width="320" height="96" rx="6" class="carte"/><rect x="24" y="346" width="320" height="96" rx="6" class="bord"/><text x="44" y="374" class="h" font-size="13.5">Trois devises, un reporting</text><text x="44" y="400" class="p" font-size="12">Franc congolais, franc CFA Ouest et</text><text x="44" y="420" class="p" font-size="12">Central. Consolidé en dollars.</text><rect x="360" y="346" width="320" height="96" rx="6" class="vfill"/><rect x="360" y="346" width="320" height="96" rx="6" class="bord"/><text x="380" y="374" class="h" font-size="13.5">Pourquoi une seule entreprise</text><text x="380" y="400" class="p" font-size="12">Parce qu’on ne réapprend pas le</text><text x="380" y="420" class="p" font-size="12">contexte à chaque module.</text><rect x="24" y="456" width="656" height="82" rx="6" class="carte"/><rect x="24" y="456" width="656" height="82" rx="6" class="bord"/><text x="44" y="484" class="h" font-size="14">Et surtout : prenez vos propres données</text><text x="44" y="510" class="p" font-size="12.5">BAOBAB sert d’exemple commun. Le vrai bénéfice arrive quand vous refaites chaque geste</text><text x="44" y="528" class="p" font-size="12.5">sur VOS chiffres. La leçon 0.3 donne le prompt qui fabrique un jeu de données de votre métier.</text></svg>