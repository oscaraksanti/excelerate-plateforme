<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 398" width="704" height="398" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="398" rx="8" class="fond"/><text x="24" y="30" class="eti">Une IA qui nettoie 5 000 lignes peut en corriger 40 de travers sans le dire</text><rect x="24" y="56" width="656" height="64" rx="6" class="carte"/><rect x="24" y="56" width="656" height="64" rx="6" class="bord"/><rect x="24" y="56" width="5" height="64" rx="2" class="vfill"/><text x="70" y="98" text-anchor="middle" class="mono vtext" font-size="24" font-weight="600">30</text><text x="120" y="84" class="h" font-size="13.5">lignes tirées au hasard</text><text x="120" y="104" class="p" font-size="12">attrape l’erreur systématique</text><rect x="24" y="128" width="656" height="64" rx="6" class="carte"/><rect x="24" y="128" width="656" height="64" rx="6" class="bord"/><rect x="24" y="128" width="5" height="64" rx="2" class="vfill"/><text x="70" y="170" text-anchor="middle" class="mono vtext" font-size="24" font-weight="600">10</text><text x="120" y="156" class="h" font-size="13.5">valeurs les plus atypiques</text><text x="120" y="176" class="p" font-size="12">attrape l’erreur sur les cas rares — la plus fréquente</text><rect x="24" y="200" width="656" height="64" rx="6" class="carte"/><rect x="24" y="200" width="656" height="64" rx="6" class="bord"/><rect x="24" y="200" width="5" height="64" rx="2" class="vfill"/><text x="70" y="242" text-anchor="middle" class="mono vtext" font-size="24" font-weight="600">1</text><text x="120" y="228" class="h" font-size="13.5">total de contrôle avant / après</text><text x="120" y="248" class="p" font-size="12">attrape la perte de lignes</text><rect x="24" y="278" width="656" height="96" rx="6" class="rfill"/><text x="44" y="304" class="h" font-size="13.5" fill="var(--r)">Pourquoi les cinquante premières lignes ne prouvent rien</text><text x="44" y="328" class="p" font-size="12.5">Elles sont toujours propres. Ce sont les cas rares qu’une IA rate — et par</text><text x="44" y="348" class="p" font-size="12.5">construction, les cas rares ne sont pas au début du fichier.</text><text x="44" y="366" class="mono t3" font-size="11">D’où les dix valeurs les plus longues, les plus courtes, les plus grandes.</text></svg>