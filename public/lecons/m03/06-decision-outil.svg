<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 388" width="704" height="388" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="388" rx="8" class="fond"/><text x="24" y="30" class="eti">Quel outil, pour quel volume — et surtout : une fois ou tous les mois</text><text x="40" y="64" class="mono t3" font-size="10.5">VOLUME</text><text x="256" y="64" class="mono t3" font-size="10.5">UNE SEULE FOIS</text><text x="472" y="64" class="mono t3" font-size="10.5">TOUS LES MOIS</text><rect x="32" y="78" width="216" height="44" rx="4" class="carte"/><rect x="32" y="78" width="216" height="44" rx="4" class="bord2"/><text x="46" y="105" class="h" font-size="12.5" fill="var(--t2)" font-weight="400">moins de 100 lignes</text><rect x="248" y="78" width="216" height="44" rx="4" class="carte"/><rect x="248" y="78" width="216" height="44" rx="4" class="bord2"/><text x="262" y="105" class="h" font-size="12.5" fill="var(--t)" font-weight="400">À la main</text><rect x="464" y="78" width="216" height="44" rx="4" class="vfill"/><rect x="464" y="78" width="216" height="44" rx="4" class="bord2"/><text x="478" y="105" class="h" font-size="12.5" fill="var(--v)" font-weight="600">Formules</text><rect x="32" y="128" width="216" height="44" rx="4" class="carte"/><rect x="32" y="128" width="216" height="44" rx="4" class="bord2"/><text x="46" y="155" class="h" font-size="12.5" fill="var(--t2)" font-weight="400">100 à 5 000</text><rect x="248" y="128" width="216" height="44" rx="4" class="carte"/><rect x="248" y="128" width="216" height="44" rx="4" class="bord2"/><text x="262" y="155" class="h" font-size="12.5" fill="var(--t)" font-weight="400">Formules ou Ctrl+E</text><rect x="464" y="128" width="216" height="44" rx="4" class="vfill"/><rect x="464" y="128" width="216" height="44" rx="4" class="bord2"/><text x="478" y="155" class="h" font-size="12.5" fill="var(--v)" font-weight="600">Power Query</text><rect x="32" y="178" width="216" height="44" rx="4" class="carte"/><rect x="32" y="178" width="216" height="44" rx="4" class="bord2"/><text x="46" y="205" class="h" font-size="12.5" fill="var(--t2)" font-weight="400">5 000 à 100 000</text><rect x="248" y="178" width="216" height="44" rx="4" class="carte"/><rect x="248" y="178" width="216" height="44" rx="4" class="bord2"/><text x="262" y="205" class="h" font-size="12.5" fill="var(--t)" font-weight="400">IA, puis on vérifie</text><rect x="464" y="178" width="216" height="44" rx="4" class="vfill"/><rect x="464" y="178" width="216" height="44" rx="4" class="bord2"/><text x="478" y="205" class="h" font-size="12.5" fill="var(--v)" font-weight="600">Power Query</text><rect x="32" y="228" width="216" height="44" rx="4" class="carte"/><rect x="32" y="228" width="216" height="44" rx="4" class="bord2"/><text x="46" y="255" class="h" font-size="12.5" fill="var(--t2)" font-weight="400">plus de 100 000</text><rect x="248" y="228" width="216" height="44" rx="4" class="carte"/><rect x="248" y="228" width="216" height="44" rx="4" class="bord2"/><text x="262" y="255" class="h" font-size="12.5" fill="var(--t)" font-weight="400">IA</text><rect x="464" y="228" width="216" height="44" rx="4" class="vfill"/><rect x="464" y="228" width="216" height="44" rx="4" class="bord2"/><text x="478" y="255" class="h" font-size="12.5" fill="var(--v)" font-weight="600">Power Query + automatisation</text><rect x="32" y="288" width="648" height="76" rx="6" class="vfill"/><text x="52" y="314" class="h" font-size="13.5" fill="var(--v)">Ce n’est pas le volume qui décide. C’est la récurrence.</text><text x="52" y="336" class="p" font-size="12.5">Cinq cents lignes une seule fois : une formule suffit.</text><text x="52" y="354" class="p" font-size="12.5">Cinq cents lignes chaque mois : une requête, et on n’en reparle plus jamais.</text></svg>