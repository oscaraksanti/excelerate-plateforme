<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 348" width="704" height="348" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="348" rx="8" class="fond"/><text x="24" y="30" class="eti">La différence entre faire le travail et le décrire</text><rect x="24" y="50" width="316" height="188" rx="6" class="carte"/><rect x="24" y="50" width="316" height="188" rx="6" class="bord"/><text x="44" y="78" class="h" font-size="14">Une formule</text><text x="44" y="100" class="p" font-size="12.5">recalcule.</text><text x="44" y="132" class="p" font-size="12">Elle vit dans une cellule.</text><text x="44" y="152" class="p" font-size="12">Elle voit une plage.</text><text x="44" y="172" class="p" font-size="12">Elle refait le même calcul</text><text x="44" y="190" class="p" font-size="12">sur les mêmes données.</text><text x="44" y="220" class="mono t3" font-size="11">le mois prochain : à refaire</text><rect x="364" y="50" width="316" height="188" rx="6" class="vfill"/><rect x="364" y="50" width="316" height="188" rx="6" class="vstroke" stroke-width="2"/><text x="384" y="78" class="h" font-size="14">Une requête</text><text x="384" y="100" class="p" font-size="12.5">rejoue.</text><text x="384" y="132" class="p" font-size="12">Elle décrit une suite</text><text x="384" y="152" class="p" font-size="12">d’opérations.</text><text x="384" y="172" class="p" font-size="12">Elle s’applique à n’importe</text><text x="384" y="190" class="p" font-size="12">quelles données du même format.</text><text x="384" y="220" class="mono vtext" font-size="11">le mois prochain : un clic</text><rect x="24" y="256" width="656" height="70" rx="6" class="carte"/><rect x="24" y="256" width="656" height="70" rx="6" class="bord"/><text x="44" y="282" class="h" font-size="13.5">Aïcha, premier lundi du mois</text><text x="44" y="306" class="p" font-size="12.5">Douze fichiers, ouvrir, copier, coller, empiler, nettoyer, recalculer :</text><text x="560" y="306" text-anchor="end" class="mono rtext" font-size="13">3 h</text><text x="580" y="306" class="p" font-size="12.5">→</text><text x="660" y="306" text-anchor="end" class="mono vtext" font-size="15" font-weight="600">1 clic</text></svg>