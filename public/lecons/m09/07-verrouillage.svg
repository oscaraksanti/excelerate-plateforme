<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 582" width="704" height="582" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="582" rx="8" class="fond"/><style>.c-bl{fill:#1d4ed8}.c-no{fill:#101418}.c-ve{fill:#15803d}.c-ro{fill:#c0392b}.r-bl{fill:#1d4ed8}.r-no{fill:#101418}.r-ve{fill:#15803d}.r-ro{fill:#c0392b}@media (prefers-color-scheme: dark){.c-bl{fill:#8ab4ff}.c-no{fill:#eef1f5}.c-ve{fill:#5fd68f}.c-ro{fill:#f87171}.r-bl{fill:#3b6fd4}.r-no{fill:#c8ced8}.r-ve{fill:#2f9e5d}.r-ro{fill:#d05c56}}</style><text x="24" y="30" class="eti">Toutes les cellules sont verrouillées d’avance — c’est le piège</text><rect x="24" y="56" width="656" height="74" rx="6" class="carte"/><rect x="24" y="56" width="656" height="74" rx="6" class="bord"/><circle cx="56" cy="93" r="17" class="vfill"/><circle cx="56" cy="93" r="17" class="vstroke"/><text x="56" y="98" class="vtext mono" font-size="14" font-weight="600" text-anchor="middle">1</text><text x="92" y="88" class="h" font-size="13.5">Ctrl+A, puis Format de cellule &gt; Protection</text><text x="92" y="112" class="p" font-size="12">on COCHE « Verrouillée » — en réalité elle l’est déjà par défaut</text><rect x="24" y="142" width="656" height="74" rx="6" class="carte"/><rect x="24" y="142" width="656" height="74" rx="6" class="bord"/><circle cx="56" cy="179" r="17" class="vfill"/><circle cx="56" cy="179" r="17" class="vstroke"/><text x="56" y="184" class="vtext mono" font-size="14" font-weight="600" text-anchor="middle">2</text><text x="92" y="174" class="h" font-size="13.5">Sélectionner les saisies de HYPOTHESES</text><text x="92" y="198" class="p" font-size="12">on DÉCOCHE « Verrouillée » : ce sont les seules cellules à laisser libres</text><rect x="24" y="228" width="656" height="74" rx="6" class="carte"/><rect x="24" y="228" width="656" height="74" rx="6" class="bord"/><circle cx="56" cy="265" r="17" class="vfill"/><circle cx="56" cy="265" r="17" class="vstroke"/><text x="56" y="270" class="vtext mono" font-size="14" font-weight="600" text-anchor="middle">3</text><text x="92" y="260" class="h" font-size="13.5">Révision &gt; Protéger la feuille</text><text x="92" y="284" class="p" font-size="12">sans mot de passe. Laisser cochée « Sélectionner les cellules déverrouillées »</text><rect x="24" y="314" width="656" height="74" rx="6" class="carte"/><rect x="24" y="314" width="656" height="74" rx="6" class="bord"/><circle cx="56" cy="351" r="17" class="vfill"/><circle cx="56" cy="351" r="17" class="vstroke"/><text x="56" y="356" class="vtext mono" font-size="14" font-weight="600" text-anchor="middle">4</text><text x="92" y="346" class="h" font-size="13.5">Révision &gt; Protéger le classeur</text><text x="92" y="370" class="p" font-size="12">empêche d’ajouter, de renommer ou de démasquer une feuille</text><rect x="24" y="400" width="656" height="84" rx="6" class="rfill"/><rect x="24" y="400" width="656" height="84" rx="6" class="bord"/><text x="44" y="426" class="h" font-size="13.5">🔴  L’ordre compte</text><text x="44" y="452" class="p" font-size="12.5">« Verrouillée » ne fait rien tant que la feuille n’est pas protégée. Protéger d’abord et</text><text x="44" y="472" class="p" font-size="12.5">déverrouiller ensuite est impossible : tout est figé, y compris la case à cocher.</text><rect x="24" y="500" width="656" height="62" rx="6" class="vfill"/><rect x="24" y="500" width="656" height="62" rx="6" class="bord"/><text x="44" y="526" class="h" font-size="13.5">Sans mot de passe : on empêche l’accident, on n’enferme personne dehors.</text><text x="44" y="548" class="p" font-size="12.5">Un modèle qu’une seule personne peut ouvrir est un modèle qui mourra avec elle.</text></svg>