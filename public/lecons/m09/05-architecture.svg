</style><rect width="704" height="434" rx="8" class="fond"/><style>.c-bl{fill:#1d4ed8}.c-no{fill:#101418}.c-ve{fill:#15803d}.c-ro{fill:#c0392b}.r-bl{fill:#1d4ed8}.r-no{fill:#101418}.r-ve{fill:#15803d}.r-ro{fill:#c0392b}@media (prefers-color-scheme: dark){.c-bl{fill:#8ab4ff}.c-no{fill:#eef1f5}.c-ve{fill:#5fd68f}.c-ro{fill:#f87171}.r-bl{fill:#3b6fd4}.r-no{fill:#c8ced8}.r-ve{fill:#2f9e5d}.r-ro{fill:#d05c56}}</style><text x="24" y="30" class="eti">Huit feuilles, un seul sens de lecture</text><rect x="24" y="56" width="156" height="96" rx="6" class="carte"/><rect x="24" y="56" width="156" height="96" rx="6" class="bord"/><text x="40" y="86" class="h" font-size="13.5">README</text><text x="40" y="110" class="p" font-size="11.5">d’où ça vient</text><text x="40" y="136" class="mono t3" font-size="11">1</text><path d="M 180 104 L 190 104" stroke="var(--b)" stroke-width="2"/><rect x="192" y="56" width="156" height="96" rx="6" class="vfill"/><rect x="192" y="56" width="156" height="96" rx="6" class="bord"/><text x="208" y="86" class="h" font-size="13.5">HYPOTHESES</text><text x="208" y="110" class="p" font-size="11.5">on ne tape que là</text><text x="208" y="136" class="mono t3" font-size="11">2</text><path d="M 348 104 L 358 104" stroke="var(--b)" stroke-width="2"/><rect x="360" y="56" width="156" height="96" rx="6" class="carte"/><rect x="360" y="56" width="156" height="96" rx="6" class="bord"/><text x="376" y="86" class="h" font-size="13.5">RAW</text><text x="376" y="110" class="p" font-size="11.5">les sources, intactes</text><text x="376" y="136" class="mono t3" font-size="11">3</text><path d="M 516 104 L 526 104" stroke="var(--b)" stroke-width="2"/><rect x="528" y="56" width="156" height="96" rx="6" class="carte"/><rect x="528" y="56" width="156" height="96" rx="6" class="bord"/><text x="544" y="86" class="h" font-size="13.5">CLEAN</text><text x="544" y="110" class="p" font-size="11.5">les mêmes, utilisables</text><text x="544" y="136" class="mono t3" font-size="11">4</text><rect x="24" y="172" width="156" height="96" rx="6" class="carte"/><rect x="24" y="172" width="156" height="96" rx="6" class="bord"/><text x="40" y="202" class="h" font-size="13.5">CALCULS</text><text x="40" y="226" class="p" font-size="11.5">zéro saisie, que du calcul</text><text x="40" y="252" class="mono t3" font-size="11">5</text><path d="M 180 220 L 190 220" stroke="var(--b)" stroke-width="2"/><rect x="192" y="172" width="156" height="96" rx="6" class="carte"/><rect x="192" y="172" width="156" height="96" rx="6" class="bord"/><text x="208" y="202" class="h" font-size="13.5">ANALYSE</text><text x="208" y="226" class="p" font-size="11.5">scénarios, sensibilités</text><text x="208" y="252" class="mono t3" font-size="11">6</text><path d="M 348 220 L 358 220" stroke="var(--b)" stroke-width="2"/><rect x="360" y="172" width="156" height="96" rx="6" class="vfill"/><rect x="360" y="172" width="156" height="96" rx="6" class="bord"/><text x="376" y="202" class="h" font-size="13.5">DASHBOARD</text><text x="376" y="226" class="p" font-size="11.5">une page, pas deux</text><text x="376" y="252" class="mono t3" font-size="11">7</text><path d="M 516 220 L 526 220" stroke="var(--b)" stroke-width="2"/><rect x="528" y="172" width="156" height="96" rx="6" class="carte"/><rect x="528" y="172" width="156" height="96" rx="6" class="bord"/><text x="544" y="202" class="h" font-size="13.5">QUALITE</text><text x="544" y="226" class="p" font-size="11.5">les contrôles bloquants</text><text x="544" y="252" class="mono t3" font-size="11">8</text><path d="M 684 104 C 698 104, 698 162, 684 162 L 38 162 C 24 162, 24 176, 24 196" stroke="var(--b)" stroke-width="1.8" fill="none"/><path d="M 20 190 L 24 198 L 28 190" stroke="var(--b)" stroke-width="1.8" fill="none"/><rect x="24" y="296" width="320" height="118" rx="6" class="vfill"/><rect x="24" y="296" width="320" height="118" rx="6" class="bord"/><text x="44" y="324" class="h" font-size="13.5">Le flux ne remonte jamais</text><text x="44" y="350" class="p" font-size="12">RAW nourrit CLEAN, CLEAN nourrit CALCULS.</text><text x="44" y="372" class="p" font-size="12">Aucune feuille ne lit une feuille</text><text x="44" y="392" class="p" font-size="12">située après elle.</text><rect x="360" y="296" width="320" height="118" rx="6" class="carte"/><rect x="360" y="296" width="320" height="118" rx="6" class="bord"/><text x="380" y="324" class="h" font-size="13.5">Deux feuilles pour le TP</text><text x="380" y="350" class="p" font-size="12">REPONSES — ce que la machine note.</text><text x="380" y="372" class="p" font-size="12">ANNEXE_IA — vos prompts, et l’erreur</text><text x="380" y="392" class="p" font-size="12">de l’IA que vous avez attrapée.</text></svg>