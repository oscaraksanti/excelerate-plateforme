<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 428" width="704" height="428" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="428" rx="8" class="fond"/><style>.c-bl{fill:#1d4ed8}.c-no{fill:#101418}.c-ve{fill:#15803d}.c-ro{fill:#c0392b}.r-bl{fill:#1d4ed8}.r-no{fill:#101418}.r-ve{fill:#15803d}.r-ro{fill:#c0392b}@media (prefers-color-scheme: dark){.c-bl{fill:#8ab4ff}.c-no{fill:#eef1f5}.c-ve{fill:#5fd68f}.c-ro{fill:#f87171}.r-bl{fill:#3b6fd4}.r-no{fill:#c8ced8}.r-ve{fill:#2f9e5d}.r-ro{fill:#d05c56}}</style><text x="24" y="30" class="eti">Deux fonctions, deux plages — c’est là que tout se joue</text><rect x="50" y="78" width="80" height="46" rx="4" class="rfill"/><rect x="50" y="78" width="80" height="46" rx="4" class="bord"/><text x="90.0" y="96" class="t3" font-size="10" text-anchor="middle">année 0</text><text x="90.0" y="114" class="mono t" font-size="11" text-anchor="middle">−320 000</text><rect x="134" y="78" width="80" height="46" rx="4" class="carte"/><rect x="134" y="78" width="80" height="46" rx="4" class="bord"/><text x="174.0" y="96" class="t3" font-size="10" text-anchor="middle">année 1</text><text x="174.0" y="114" class="mono t" font-size="11" text-anchor="middle">68 000</text><rect x="218" y="78" width="80" height="46" rx="4" class="carte"/><rect x="218" y="78" width="80" height="46" rx="4" class="bord"/><text x="258.0" y="96" class="t3" font-size="10" text-anchor="middle">année 2</text><text x="258.0" y="114" class="mono t" font-size="11" text-anchor="middle">94 000</text><rect x="302" y="78" width="80" height="46" rx="4" class="carte"/><rect x="302" y="78" width="80" height="46" rx="4" class="bord"/><text x="342.0" y="96" class="t3" font-size="10" text-anchor="middle">année 3</text><text x="342.0" y="114" class="mono t" font-size="11" text-anchor="middle">121 000</text><rect x="386" y="78" width="80" height="46" rx="4" class="carte"/><rect x="386" y="78" width="80" height="46" rx="4" class="bord"/><text x="426.0" y="96" class="t3" font-size="10" text-anchor="middle">année 4</text><text x="426.0" y="114" class="mono t" font-size="11" text-anchor="middle">138 000</text><rect x="470" y="78" width="80" height="46" rx="4" class="carte"/><rect x="470" y="78" width="80" height="46" rx="4" class="bord"/><text x="510.0" y="96" class="t3" font-size="10" text-anchor="middle">année 5</text><text x="510.0" y="114" class="mono t" font-size="11" text-anchor="middle">142 000</text><rect x="554" y="78" width="80" height="46" rx="4" class="carte"/><rect x="554" y="78" width="80" height="46" rx="4" class="bord"/><text x="594.0" y="96" class="t3" font-size="10" text-anchor="middle">année 6</text><text x="594.0" y="114" class="mono t" font-size="11" text-anchor="middle">126 000</text><rect x="132" y="134" width="502" height="26" rx="4" class="vfill"/><text x="146" y="152" class="vtext" font-size="12">VAN( taux ; ces six-là )   puis  + année 0</text><rect x="46" y="170" width="586" height="26" rx="4" class="vfill"/><text x="62" y="188" class="vtext" font-size="12">TRI( toute la plage, année 0 comprise )</text><text x="46" y="224" class="p" font-size="13">VAN exclut le flux du présent. TRI l’exige. C’est l’inverse, et c’est tout le piège.</text><rect x="24" y="258" width="320" height="150" rx="6" class="rfill"/><rect x="24" y="258" width="320" height="150" rx="6" class="bord"/><text x="44" y="286" class="h" font-size="14">L’erreur silencieuse</text><text x="44" y="312" class="mono rtext" font-size="11.5">=VAN(t ; TOUTE la plage)</text><text x="44" y="340" class="p" font-size="12">Toute la série glisse d’une période.</text><text x="44" y="362" class="p" font-size="12">La VAN est divisée par (1 + t).</text><text x="44" y="390" class="mono rtext" font-size="11">Ici : −12,3 %, et le signe ne change jamais.</text><rect x="360" y="258" width="320" height="150" rx="6" class="vfill"/><rect x="360" y="258" width="320" height="150" rx="6" class="bord"/><text x="380" y="286" class="h" font-size="14">Pourquoi elle survit des années</text><text x="380" y="312" class="p" font-size="12">Un projet rentable le reste.</text><text x="380" y="334" class="p" font-size="12">Un classement de projets ne bouge pas.</text><text x="380" y="356" class="p" font-size="12">Rien ne crie. Rien ne casse.</text><text x="380" y="390" class="mono vtext" font-size="11">Jusqu’au comité qui exige 100 000 de VAN.</text></svg>