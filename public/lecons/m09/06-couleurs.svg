<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 504" width="704" height="504" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="504" rx="8" class="fond"/><style>.c-bl{fill:#1d4ed8}.c-no{fill:#101418}.c-ve{fill:#15803d}.c-ro{fill:#c0392b}.r-bl{fill:#1d4ed8}.r-no{fill:#101418}.r-ve{fill:#15803d}.r-ro{fill:#c0392b}@media (prefers-color-scheme: dark){.c-bl{fill:#8ab4ff}.c-no{fill:#eef1f5}.c-ve{fill:#5fd68f}.c-ro{fill:#f87171}.r-bl{fill:#3b6fd4}.r-no{fill:#c8ced8}.r-ve{fill:#2f9e5d}.r-ro{fill:#d05c56}}</style><text x="24" y="30" class="eti">Universelle en finance, inconnue partout ailleurs</text><rect x="24" y="58" width="656" height="70" rx="6" class="carte"/><rect x="24" y="58" width="656" height="70" rx="6" class="bord"/><rect x="24" y="58" width="7" height="70" rx="3" class="r-bl"/><text x="52" y="88" font-size="14" font-weight="600" class="c-bl">Bleu</text><text x="128" y="88" class="h" font-size="13.5">une saisie</text><text x="128" y="112" class="mono c-bl" font-size="11.5">4 350</text><text x="380" y="112" class="p" font-size="12">elle vit sur HYPOTHESES, et nulle part ailleurs</text><rect x="24" y="140" width="656" height="70" rx="6" class="carte"/><rect x="24" y="140" width="656" height="70" rx="6" class="bord"/><rect x="24" y="140" width="7" height="70" rx="3" class="r-no"/><text x="52" y="170" font-size="14" font-weight="600" class="c-no">Noir</text><text x="128" y="170" class="h" font-size="13.5">une formule</text><text x="128" y="194" class="mono c-no" font-size="11.5">=C7*H_PRIX_XOF</text><text x="380" y="194" class="p" font-size="12">elle se recalcule ; on n’y touche pas</text><rect x="24" y="222" width="656" height="70" rx="6" class="carte"/><rect x="24" y="222" width="656" height="70" rx="6" class="bord"/><rect x="24" y="222" width="7" height="70" rx="3" class="r-ve"/><text x="52" y="252" font-size="14" font-weight="600" class="c-ve">Vert</text><text x="128" y="252" class="h" font-size="13.5">un lien vers une autre feuille</text><text x="128" y="276" class="mono c-ve" font-size="11.5">=CALCULS!M30</text><text x="380" y="276" class="p" font-size="12">il traverse le classeur, il ne le quitte pas</text><rect x="24" y="304" width="656" height="70" rx="6" class="carte"/><rect x="24" y="304" width="656" height="70" rx="6" class="bord"/><rect x="24" y="304" width="7" height="70" rx="3" class="r-ro"/><text x="52" y="334" font-size="14" font-weight="600" class="c-ro">Rouge</text><text x="128" y="334" class="h" font-size="13.5">un lien vers un AUTRE classeur</text><text x="128" y="358" class="mono c-ro" font-size="11.5">=&#x27;[Budget.xlsx]T1&#x27;!B4</text><text x="380" y="358" class="p" font-size="12">il casse le jour où le fichier bouge</text><rect x="24" y="392" width="656" height="92" rx="6" class="vfill"/><rect x="24" y="392" width="656" height="92" rx="6" class="bord"/><text x="44" y="418" class="h" font-size="13.5">💎  Le geste qui met tout en bleu d’un coup</text><text x="44" y="444" class="p" font-size="12.5">F5 &gt; Cellules &gt; Constantes sélectionne toutes les valeurs tapées de la feuille. On les</text><text x="44" y="464" class="p" font-size="12.5">colore en une fois — et le même geste, lancé ailleurs que sur HYPOTHESES, doit ne rien trouver.</text></svg>