<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 414" width="704" height="414" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="414" rx="8" class="fond"/><style>.c-bl{fill:#1d4ed8}.c-no{fill:#101418}.c-ve{fill:#15803d}.c-ro{fill:#c0392b}.r-bl{fill:#1d4ed8}.r-no{fill:#101418}.r-ve{fill:#15803d}.r-ro{fill:#c0392b}@media (prefers-color-scheme: dark){.c-bl{fill:#8ab4ff}.c-no{fill:#eef1f5}.c-ve{fill:#5fd68f}.c-ro{fill:#f87171}.r-bl{fill:#3b6fd4}.r-no{fill:#c8ced8}.r-ve{fill:#2f9e5d}.r-ro{fill:#d05c56}}</style><text x="24" y="30" class="eti">Le même modèle, deux fois</text><rect x="24" y="50" width="316" height="264" rx="6" class="rfill"/><rect x="24" y="50" width="316" height="264" rx="6" class="bord"/><text x="44" y="78" class="h" font-size="14.5">Éparpillées</text><text x="44" y="100" class="p" font-size="12">Chaque chiffre vit dans une formule.</text><rect x="44" y="113" width="276" height="23" rx="3" class="carte"/><text x="54" y="128" class="mono c-ro" font-size="11">=B12*4350</text><rect x="44" y="141" width="276" height="23" rx="3" class="carte"/><text x="54" y="156" class="mono c-ro" font-size="11">=B12*4,55*631,4</text><rect x="44" y="169" width="276" height="23" rx="3" class="carte"/><text x="54" y="184" class="mono c-ro" font-size="11">=SOMME(D:D)-11150000</text><rect x="44" y="197" width="276" height="23" rx="3" class="carte"/><text x="54" y="212" class="mono c-ro" font-size="11">=E20/631,4</text><rect x="44" y="225" width="276" height="23" rx="3" class="carte"/><text x="54" y="240" class="mono c-ro" font-size="11">=F8*(1+0,45%)^24</text><rect x="44" y="253" width="276" height="23" rx="3" class="carte"/><text x="54" y="268" class="mono c-ro" font-size="11">=G3*0,14</text><text x="44" y="300" class="p" font-size="12">Changer le taux : six cellules à retrouver.</text><rect x="364" y="50" width="316" height="264" rx="6" class="vfill"/><rect x="364" y="50" width="316" height="264" rx="6" class="bord"/><text x="384" y="78" class="h" font-size="14.5">Rassemblées</text><text x="384" y="100" class="p" font-size="12">Les formules ne portent que des noms.</text><rect x="384" y="113" width="276" height="23" rx="3" class="carte"/><text x="394" y="128" class="mono c-bl" font-size="11">=B12*H_PRIX_XOF</text><rect x="384" y="141" width="276" height="23" rx="3" class="carte"/><text x="394" y="156" class="mono c-bl" font-size="11">=B12*H_COUT_USD*H_TAUX_XOF</text><rect x="384" y="169" width="276" height="23" rx="3" class="carte"/><text x="394" y="184" class="mono c-bl" font-size="11">=SOMME(D:D)-H_CHARGES</text><rect x="384" y="197" width="276" height="23" rx="3" class="carte"/><text x="394" y="212" class="mono c-bl" font-size="11">=E20/H_TAUX_XOF</text><rect x="384" y="225" width="276" height="23" rx="3" class="carte"/><text x="394" y="240" class="mono c-bl" font-size="11">=F8*(1+H_DERIVE_TAUX)^24</text><rect x="384" y="253" width="276" height="23" rx="3" class="carte"/><text x="394" y="268" class="mono c-bl" font-size="11">=G3*H_ACTUALISATION</text><text x="384" y="300" class="p" font-size="12">Changer le taux : une cellule, sur HYPOTHESES.</text><rect x="24" y="332" width="656" height="62" rx="6" class="carte"/><rect x="24" y="332" width="656" height="62" rx="6" class="bord"/><text x="44" y="358" class="h" font-size="13.5">Les quatorze hypothèses de ce plan tiennent sur une feuille, et elles y sont toutes.</text><text x="44" y="380" class="p" font-size="12.5">Une cellule bleue ailleurs dans le classeur est un bug — pas un choix de présentation.</text></svg>