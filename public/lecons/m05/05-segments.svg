/text><text x="352" y="246" class="mono t3" font-size="11">filtré sur Abidjan, sans y toucher</text><rect x="24" y="288" width="656" height="78" rx="6" class="vfill"/><text x="44" y="314" class="h" font-size="13.5">Le geste qui manque à presque tout le monde</text><text x="44" y="338" class="mono t" font-size="11.5">Clic droit sur le segment  →  Connexions de rapport  →  cocher les trois TCD.</text><text x="44" y="358" class="p" font-size="12.5">Un clic pilote désormais toute la page.</text></svg>