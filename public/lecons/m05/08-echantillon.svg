<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 434" width="704" height="434" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="434" rx="8" class="fond"/><text x="24" y="30" class="eti">29 046 lignes — et les quatre blocs qu’on envoie à la place</text><rect x="24" y="54" width="200" height="248" rx="6" class="rfill"/><rect x="24" y="54" width="200" height="248" rx="6" class="bord"/><text x="44" y="80" class="eti" font-size="10.5">La tentation</text><text x="44" y="122" class="mono rtext" font-size="26" font-weight="600">29 046</text><text x="44" y="146" class="p" font-size="12">lignes collées</text><text x="44" y="164" class="p" font-size="12">d’un seul bloc</text><text x="44" y="202" class="mono t3" font-size="10.5">Le modèle en lit</text><text x="44" y="217" class="mono t3" font-size="10.5">une partie, et comble</text><text x="44" y="232" class="mono t3" font-size="10.5">le reste tout seul.</text><text x="44" y="268" class="mono rtext" font-size="10.5">Rien ne signale</text><text x="44" y="283" class="mono rtext" font-size="10.5">la troncature.</text><rect x="244" y="54" width="436" height="54" rx="6" class="vfill"/><rect x="244" y="54" width="436" height="54" rx="6" class="bord"/><text x="264" y="78" class="h" font-size="13">① Les en-têtes et leur sens</text><text x="264" y="96" class="mono t3" font-size="10.5">11 colonnes, une ligne de description chacune</text><rect x="244" y="116" width="436" height="54" rx="6" class="vfill"/><rect x="244" y="116" width="436" height="54" rx="6" class="bord"/><text x="264" y="140" class="h" font-size="13">② Trente lignes, prises au hasard</text><text x="264" y="158" class="mono t3" font-size="10.5">pas les trente premières : elles sont triées</text><rect x="244" y="178" width="436" height="54" rx="6" class="vfill"/><rect x="244" y="178" width="436" height="54" rx="6" class="bord"/><text x="264" y="202" class="h" font-size="13">③ Les valeurs distinctes de chaque dimension</text><text x="264" y="220" class="mono t3" font-size="10.5">3 agences · 8 libellés de famille · 12 mois</text><rect x="244" y="240" width="436" height="54" rx="6" class="vfill"/><rect x="244" y="240" width="436" height="54" rx="6" class="bord"/><text x="264" y="264" class="h" font-size="13">④ Les totaux de contrôle</text><text x="264" y="282" class="mono t3" font-size="10.5">CA total, nombre de lignes, nombre de commandes</text><rect x="24" y="318" width="656" height="94" rx="6" class="carte"/><rect x="24" y="318" width="656" height="94" rx="6" class="bord"/><text x="44" y="344" class="h" font-size="13.5">La règle qui vaut pour tout le module</text><text x="44" y="370" class="p" font-size="12.5">On ne demande pas la réponse. On demande LE TABLEAU CROISÉ QUI LA PRODUIT.</text><text x="44" y="394" class="mono vtext" font-size="11.5">La réponse n’est pas vérifiable. Le tableau, si — et il reste dans le fichier.</text></svg>