</style><rect width="704" height="402" rx="8" class="fond"/><text x="24" y="30" class="eti">Quatre zones, et la question qu’elles composent</text><rect x="24" y="50" width="172" height="246" rx="6" class="carte"/><rect x="24" y="50" width="172" height="246" rx="6" class="bord"/><text x="40" y="74" class="h" font-size="13">Champs disponibles</text><text x="40" y="100" class="mono vtext" font-size="11.5">● Date_Vente</text><text x="40" y="121" class="mono vtext" font-size="11.5">● Agence</text><text x="40" y="142" class="mono t3" font-size="11.5">○ Devise</text><text x="40" y="163" class="mono t3" font-size="11.5">○ Client</text><text x="40" y="184" class="mono t3" font-size="11.5">○ N_Commande</text><text x="40" y="205" class="mono t3" font-size="11.5">○ Reference</text><text x="40" y="226" class="mono vtext" font-size="11.5">● Famille</text><text x="40" y="247" class="mono t3" font-size="11.5">○ Quantite</text><text x="40" y="268" class="mono vtext" font-size="11.5">● Montant_USD</text><rect x="212" y="50" width="232" height="108" rx="6" class="carte"/><rect x="212" y="50" width="232" height="108" rx="6" class="bord"/><text x="228" y="76" class="eti" font-size="10.5">FILTRES</text><text x="228" y="104" class="mono t" font-size="13" font-weight="600">Famille</text><text x="228" y="128" class="p" font-size="11.5">une seule famille à la fois</text><rect x="448" y="50" width="232" height="108" rx="6" class="carte"/><rect x="448" y="50" width="232" height="108" rx="6" class="bord"/><text x="464" y="76" class="eti" font-size="10.5">COLONNES</text><text x="464" y="104" class="mono t" font-size="13" font-weight="600">Agence</text><text x="464" y="128" class="p" font-size="11.5">une colonne par agence</text><rect x="212" y="174" width="232" height="108" rx="6" class="carte"/><rect x="212" y="174" width="232" height="108" rx="6" class="bord"/><text x="228" y="200" class="eti" font-size="10.5">LIGNES</text><text x="228" y="228" class="mono t" font-size="13" font-weight="600">Date_Vente</text><text x="228" y="252" class="p" font-size="11.5">groupée par mois</text><rect x="448" y="174" width="232" height="108" rx="6" class="vfill"/><rect x="448" y="174" width="232" height="108" rx="6" class="bord"/><text x="464" y="200" class="eti" font-size="10.5">VALEURS</text><text x="464" y="228" class="mono t" font-size="13" font-weight="600">Somme de Montant_USD</text><text x="464" y="252" class="p" font-size="11.5">l’agrégation se choisit ici</text><text x="464" y="270" class="mono vtext" font-size="10.5">Nombre de → Somme de</text><rect x="24" y="312" width="656" height="70" rx="6" class="vfill"/><text x="44" y="338" class="p" font-size="12">Ce que ces quatre zones disent, en français :</text><text x="44" y="364" class="h" font-size="14">« Le chiffre d’affaires en dollars, par mois, par agence, pour la famille Riz. »</text></svg>