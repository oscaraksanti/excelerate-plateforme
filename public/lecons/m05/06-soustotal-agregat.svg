rges, qui contient trois erreurs</text><line x1="24" y1="302" x2="680" y2="302" class="bord2"/><text x="40" y="292" class="mono rtext" font-size="12">=SOMME(marges)</text><text x="300" y="292" class="mono rtext" font-size="12">#DIV/0!</text><line x1="24" y1="332" x2="680" y2="332" class="bord2"/><text x="40" y="322" class="mono rtext" font-size="12">=MOYENNE(marges)</text><text x="300" y="322" class="mono rtext" font-size="12">#DIV/0!</text><line x1="24" y1="362" x2="680" y2="362" class="bord2"/><text x="40" y="352" class="mono vtext" font-size="12">=AGREGAT(1;6;marges)</text><text x="300" y="352" class="mono vtext" font-size="12">34,87 %</text><line x1="24" y1="392" x2="680" y2="392" class="bord2"/><text x="40" y="382" class="mono vtext" font-size="12">=AGREGAT(1;7;marges)</text><text x="300" y="382" class="mono vtext" font-size="12">34,91 %</text><text x="452" y="352" class="mono t3" font-size="11">6 = ignorer les erreurs</text><text x="452" y="382" class="mono t3" font-size="11">7 = les erreurs ET le masquage</text><rect x="24" y="404" width="656" height="52" rx="6" class="vfill"/><text x="44" y="434" class="p" font-size="12.5">Aucune fonction classique ne survit à une erreur dans la plage. AGREGAT, si.</text></svg>