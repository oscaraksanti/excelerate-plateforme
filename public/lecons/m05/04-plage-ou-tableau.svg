</style><rect width="704" height="384" rx="8" class="fond"/><text x="24" y="30" class="eti">La cause n° 1 des tableaux croisés faux en entreprise</text><rect x="24" y="52" width="320" height="198" rx="6" class="rfill"/><rect x="24" y="52" width="320" height="198" rx="6" class="bord"/><text x="44" y="78" class="h" font-size="13.5">Source : une plage</text><text x="44" y="104" class="mono rtext" font-size="12">Ventes!$A$1:$K$29047</text><text x="44" y="136" class="p" font-size="12">Le mois suivant, 2 400 lignes</text><text x="44" y="156" class="p" font-size="12">arrivent en ligne 29 048.</text><text x="44" y="188" class="mono t" font-size="12" font-weight="600">Actualiser</text><text x="44" y="210" class="rtext" font-size="13" font-weight="600">Le total ne bouge pas.</text><text x="44" y="232" class="mono t3" font-size="11">Aucune erreur. Aucune alerte.</text><rect x="360" y="52" width="320" height="198" rx="6" class="vfill"/><rect x="360" y="52" width="320" height="198" rx="6" class="bord"/><text x="380" y="78" class="h" font-size="13.5">Source : un tableau</text><text x="380" y="104" class="mono vtext" font-size="12">t_Ventes</text><text x="380" y="136" class="p" font-size="12">Les mêmes 2 400 lignes</text><text x="380" y="156" class="p" font-size="12">sont collées sous la dernière.</text><text x="380" y="188" class="mono t" font-size="12" font-weight="600">Actualiser</text><text x="380" y="210" class="vtext" font-size="13" font-weight="600">Le total suit.</text><text x="380" y="232" class="mono t3" font-size="11">Le tableau s’est étendu tout seul.</text><rect x="24" y="268" width="656" height="94" rx="6" class="carte"/><rect x="24" y="268" width="656" height="94" rx="6" class="bord"/><text x="44" y="294" class="h" font-size="13.5">Comment on s’en aperçoit — et c’est tout le sujet du TP</text><text x="44" y="320" class="p" font-size="12.5">On compare le chiffre du TCD à un SOMME.SI.ENS sur les mêmes critères.</text><text x="44" y="344" class="mono vtext" font-size="11.5">R_ECART_TCD  =  chiffre lu dans le TCD  −  chiffre de la formule  →  doit valoir 0</text></svg>