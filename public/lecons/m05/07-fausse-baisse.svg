<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 482" width="704" height="482" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="482" rx="8" class="fond"/><text x="24" y="30" class="eti">Une baisse de 12 % qui n’a jamais eu lieu</text><line x1="24" y1="96" x2="680" y2="96" class="bord"/><line x1="352" y1="76" x2="352" y2="116" stroke="var(--r)" stroke-width="2"/><text x="352" y="68" class="mono rtext" font-size="11" text-anchor="middle">1er mars 2026</text><text x="24" y="132" class="eti" font-size="10.5">Avant</text><text x="24" y="156" class="mono t" font-size="12.5">Savons</text><text x="24" y="178" class="mono t" font-size="12.5">Conserves</text><text x="376" y="132" class="eti" font-size="10.5">Après — même produits, même clients</text><text x="376" y="156" class="mono vtext" font-size="12.5">Hygiène &amp; entretien</text><text x="376" y="178" class="mono vtext" font-size="12.5">Épicerie sèche</text><text x="24" y="206" class="p" font-size="12.5">Douala a changé de plan comptable. Rien d’autre n’a bougé : ni les ventes, ni les prix.</text><rect x="24" y="232" width="320" height="128" rx="6" class="rfill"/><rect x="24" y="232" width="320" height="128" rx="6" class="bord"/><text x="44" y="258" class="eti" font-size="10.5">Ce que le TCD affiche</text><text x="44" y="284" class="p" font-size="12">si on filtre sur les six familles</text><text x="44" y="304" class="p" font-size="12">du catalogue historique</text><text x="44" y="340" class="mono rtext" font-size="24" font-weight="600">− 12,2 %</text><rect x="360" y="232" width="320" height="128" rx="6" class="vfill"/><rect x="360" y="232" width="320" height="128" rx="6" class="bord"/><text x="380" y="258" class="eti" font-size="10.5">Ce qui s’est réellement passé</text><text x="380" y="284" class="p" font-size="12">en regroupant les huit libellés</text><text x="380" y="304" class="p" font-size="12">dans leurs six familles</text><text x="380" y="340" class="mono vtext" font-size="24" font-weight="600">+ 2,9 %</text><rect x="24" y="378" width="656" height="82" rx="6" class="carte"/><rect x="24" y="378" width="656" height="82" rx="6" class="bord"/><text x="44" y="404" class="h" font-size="13.5">Aucun contrôle technique ne pouvait l’attraper</text><text x="44" y="428" class="p" font-size="12.5">La formule était juste. L’ordre de grandeur, plausible. La version d’Excel, sans importance.</text><text x="44" y="448" class="mono vtext" font-size="11.5">V4 — Vérité métier : « qui, dans l’entreprise, confirmerait ce chiffre ? »</text></svg>