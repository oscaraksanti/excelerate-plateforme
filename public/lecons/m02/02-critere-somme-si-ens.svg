<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 392" width="704" height="392" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="392" rx="8" class="fond"/><text x="24" y="30" class="eti">La syntaxe qui bloque tout le monde</text><rect x="24" y="48" width="656" height="46" rx="5" class="carte"/><rect x="24" y="48" width="656" height="46" rx="5" class="bord"/><text x="38" y="77" class="mono t3" font-size="14" font-weight="400">=SOMME.SI.ENS(</text><text x="168" y="77" class="mono t" font-size="14" font-weight="400">plage_à_sommer</text><text x="288" y="77" class="mono t3" font-size="14" font-weight="400"> ; </text><text x="312" y="77" class="mono t" font-size="14" font-weight="400">plage_critère</text><text x="414" y="77" class="mono t3" font-size="14" font-weight="400"> ; </text><text x="422" y="77" class="mono vtext" font-size="14" font-weight="600">&quot;&gt;=&quot;&amp;$B$1</text><text x="540" y="77" class="mono t3" font-size="14" font-weight="400">)</text><rect x="446" y="52" width="86" height="38" rx="4" class="vstroke" stroke-width="2"/><text x="40" y="126" class="mono" font-size="12" fill="var(--r)">&quot;&gt;=1000&quot;</text><text x="250" y="126" class="p" font-size="12.5">le seuil écrit en dur — faux dès le mois prochain</text><line x1="24" y1="135" x2="680" y2="135" class="bord2"/><text x="40" y="154" class="mono" font-size="12" fill="var(--t)">&quot;&gt;=&quot;&amp;$B$1</text><text x="250" y="154" class="p" font-size="12.5">le seuil vit dans une cellule : on change B1, tout suit</text><line x1="24" y1="163" x2="680" y2="163" class="bord2"/><text x="40" y="182" class="mono" font-size="12" fill="var(--t)">&quot;&lt;&gt;&quot;</text><text x="250" y="182" class="p" font-size="12.5">tout ce qui n’est pas vide</text><line x1="24" y1="191" x2="680" y2="191" class="bord2"/><text x="40" y="210" class="mono" font-size="12" fill="var(--t)">&quot;Kin*&quot;</text><text x="250" y="210" class="p" font-size="12.5">tout ce qui commence par Kin</text><line x1="24" y1="219" x2="680" y2="219" class="bord2"/><text x="40" y="238" class="mono" font-size="12" fill="var(--t)">&quot;&gt;=&quot;&amp;DATE(2026;1;1)</text><text x="250" y="238" class="p" font-size="12.5">une date — jamais ">=01/01/2026" en dur</text><line x1="24" y1="247" x2="680" y2="247" class="bord2"/><rect x="24" y="276" width="656" height="94" rx="6" class="rfill"/><text x="44" y="302" class="h" font-size="13.5" fill="var(--r)">L’erreur qui ne dit rien</text><text x="44" y="324" class="p" font-size="12.5">Une plage à sommer plus courte que la plage de critère donne un résultat faux.</text><text x="44" y="344" class="p" font-size="12.5">Aucune erreur, aucun avertissement. Le contrôle : comparer leur hauteur.</text></svg>