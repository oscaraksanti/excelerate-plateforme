<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 476" width="704" height="476" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="476" rx="8" class="fond"/><text x="24" y="30" class="eti">Quatre contrôles, quatre minutes, pour toute la formation</text><rect x="24" y="52" width="656" height="74" rx="6" class="carte"/><rect x="24" y="52" width="656" height="74" rx="6" class="bord"/><rect x="24" y="52" width="5" height="74" rx="2" class="vfill"/><text x="50" y="86" class="mono vtext" font-size="20" font-weight="600">V1</text><text x="50" y="108" class="p" font-size="11.5">Version</text><text x="150" y="82" class="h" font-size="13">Cette fonction existe-t-elle dans MON Excel ?</text><text x="150" y="102" class="h" font-size="13">Le séparateur est-il le bon ?</text><text x="660" y="82" text-anchor="end" class="mono t3" font-size="12">10 s</text><rect x="24" y="134" width="656" height="74" rx="6" class="carte"/><rect x="24" y="134" width="656" height="74" rx="6" class="bord"/><rect x="24" y="134" width="5" height="74" rx="2" class="vfill"/><text x="50" y="168" class="mono vtext" font-size="20" font-weight="600">V2</text><text x="50" y="190" class="p" font-size="11.5">Valeurs</text><text x="150" y="164" class="h" font-size="13">Juste sur trois cas connus — ET sur un cas</text><text x="150" y="184" class="h" font-size="13">limite : vide, zéro, négatif, texte ?</text><text x="660" y="164" text-anchor="end" class="mono t3" font-size="12">2 min</text><rect x="24" y="216" width="656" height="74" rx="6" class="carte"/><rect x="24" y="216" width="656" height="74" rx="6" class="bord"/><rect x="24" y="216" width="5" height="74" rx="2" class="vfill"/><text x="50" y="250" class="mono vtext" font-size="20" font-weight="600">V3</text><text x="50" y="272" class="p" font-size="11.5">Volumétrie</text><text x="150" y="246" class="h" font-size="13">Ça tient sur toute la plage ?</text><text x="150" y="266" class="h" font-size="13">Combien de lignes en entrée, combien en sortie ?</text><text x="660" y="246" text-anchor="end" class="mono t3" font-size="12">1 min</text><rect x="24" y="298" width="656" height="74" rx="6" class="carte"/><rect x="24" y="298" width="656" height="74" rx="6" class="bord"/><rect x="24" y="298" width="5" height="74" rx="2" class="vfill"/><text x="50" y="332" class="mono vtext" font-size="20" font-weight="600">V4</text><text x="50" y="354" class="p" font-size="11.5">Vérité métier</text><text x="150" y="328" class="h" font-size="13">L’ordre de grandeur est-il plausible ?</text><text x="150" y="348" class="h" font-size="13">Un collègue du métier validerait-il ?</text><text x="660" y="328" text-anchor="end" class="mono t3" font-size="12">1 min</text><rect x="24" y="384" width="656" height="76" rx="6" class="vfill"/><text x="44" y="410" class="h" font-size="13.5" fill="var(--v)">La ligne que les autres formations ne montrent jamais</text><text x="44" y="432" class="p" font-size="12.5">Classique 35 min · IA 5 min · <tspan font-weight="600">Vérification 6 min</tspan>.</text><text x="44" y="450" class="p" font-size="12">5 + 6 ne fait pas 5. Ça fait quand même 24 minutes de gagnées, et c’est défendable.</text></svg>