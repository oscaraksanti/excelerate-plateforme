<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 444" width="704" height="444" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="444" rx="8" class="fond"/><text x="24" y="30" class="eti">Pourquoi 1,2 million de lignes pèsent moins que 120 000</text><text x="44" y="80" class="h" font-size="13">Le fichier CSV en entrée</text><rect x="44" y="88" width="271" height="20" rx="3" fill="#C0392B"/><text x="327.1774193548387" y="104" class="mono rtext" font-size="12.5" font-weight="600">39,1 Mo</text><text x="44" y="142" class="h" font-size="13">Le même, dans une feuille Excel</text><rect x="44" y="150" width="430" height="20" rx="3" fill="#C0392B"/><text x="486.0" y="166" class="mono rtext" font-size="12.5" font-weight="600">62,0 Mo</text><text x="44" y="204" class="h" font-size="13">Le même, dans le modèle de données</text><rect x="44" y="212" width="28" height="20" rx="3" fill="#2F6B47"/><text x="83.74193548387098" y="228" class="mono vtext" font-size="12.5" font-weight="600">4,0 Mo</text><text x="44" y="252" class="mono t3" font-size="11">Une feuille ne peut de toute façon pas contenir 1,2 million de lignes : la limite est 1 048 576.</text><rect x="24" y="274" width="656" height="152" rx="6" class="vfill"/><rect x="24" y="274" width="656" height="152" rx="6" class="bord"/><text x="44" y="300" class="h" font-size="13.5">Comment il fait</text><text x="44" y="328" class="p" font-size="12.5">· Il stocke COLONNE par colonne, pas ligne par ligne.</text><text x="44" y="352" class="p" font-size="12.5">· Dans chaque colonne, il ne garde qu’une fois chaque valeur distincte.</text><text x="44" y="376" class="p" font-size="12.5">· Agence_Cle : 1,2 million de cases, six valeurs. Presque rien.</text><text x="44" y="400" class="p" font-size="12.5">· Montant_Local : beaucoup de valeurs distinctes. C’est lui qui pèse.</text><text x="44" y="416" class="mono vtext" font-size="11.5">D’où la règle : une colonne à peu de valeurs distinctes est presque gratuite.</text></svg>