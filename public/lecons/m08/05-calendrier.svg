<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 414" width="704" height="414" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="414" rx="8" class="fond"/><text x="24" y="30" class="eti">Le clic qui débloque la moitié du DAX</text><rect x="24" y="52" width="330" height="170" rx="6" class="rfill"/><rect x="24" y="52" width="330" height="170" rx="6" class="bord"/><text x="44" y="78" class="h" font-size="14">Sans le clic</text><text x="44" y="104" class="p" font-size="12">Conception &gt; Marquer comme table</text><text x="44" y="124" class="p" font-size="12">de dates → pas fait.</text><text x="44" y="156" class="mono rtext" font-size="11.5">SAMEPERIODLASTYEAR</text><text x="44" y="176" class="mono rtext" font-size="11.5">TOTALYTD · DATEADD · DATESYTD</text><text x="44" y="204" class="mono rtext" font-size="11.5">rendent vide. Sans erreur.</text><rect x="374" y="52" width="306" height="170" rx="6" class="vfill"/><rect x="374" y="52" width="306" height="170" rx="6" class="bord"/><text x="394" y="78" class="h" font-size="14">Avec le clic</text><text x="394" y="104" class="p" font-size="12">Une colonne de dates, continue,</text><text x="394" y="124" class="p" font-size="12">unique, sans trou, désignée.</text><text x="394" y="156" class="mono vtext" font-size="11.5">Toute la time intelligence</text><text x="394" y="176" class="mono vtext" font-size="11.5">fonctionne.</text><text x="394" y="204" class="mono t3" font-size="11">Trois secondes de travail.</text><rect x="24" y="240" width="656" height="156" rx="6" class="carte"/><rect x="24" y="240" width="656" height="156" rx="6" class="bord"/><text x="44" y="266" class="h" font-size="13.5">Les quatre conditions d’une table de dates valable</text><text x="44" y="294" class="p" font-size="12.5">① Une ligne par jour — pas par mois, pas par semaine.</text><text x="44" y="318" class="p" font-size="12.5">② Sans aucun trou, du 1er janvier de la première année au 31 décembre de la dernière.</text><text x="44" y="342" class="p" font-size="12.5">③ Une colonne de type Date, unique, qui sert de clé.</text><text x="44" y="366" class="p" font-size="12.5">④ Générée par la requête, jamais saisie à la main.</text><text x="44" y="386" class="mono vtext" font-size="11.5">Et l’année doit être COMPLÈTE, même si les ventes s’arrêtent en septembre.</text></svg>