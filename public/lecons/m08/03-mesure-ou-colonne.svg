<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 420" width="704" height="420" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="420" rx="8" class="fond"/><text x="24" y="30" class="eti">La distinction la plus mal comprise de la BI</text><rect x="24" y="54" width="330" height="232" rx="6" class="carte"/><rect x="24" y="54" width="330" height="232" rx="6" class="bord"/><text x="44" y="82" class="h" font-size="15">Colonne calculée</text><text x="44" y="106" class="eti" font-size="10.5">CALCULÉE À L’ACTUALISATION</text><text x="44" y="136" class="p" font-size="12">· une valeur par ligne, stockée</text><text x="44" y="160" class="p" font-size="12">· occupe de la mémoire · 1,2 M de valeurs</text><text x="44" y="184" class="p" font-size="12">· se calcule une fois, puis dort</text><text x="44" y="208" class="p" font-size="12">· utilisable en ligne, colonne, filtre</text><text x="44" y="232" class="p" font-size="12">· quand il faut GROUPER par elle</text><text x="44" y="266" class="mono t3" font-size="10.5">Cle_Taux, Tranche_Age, Segment</text><rect x="374" y="54" width="306" height="232" rx="6" class="vfill"/><rect x="374" y="54" width="306" height="232" rx="6" class="bord"/><text x="394" y="82" class="h" font-size="15">Mesure</text><text x="394" y="106" class="eti" font-size="10.5">CALCULÉE À L’AFFICHAGE</text><text x="394" y="136" class="p" font-size="12">· aucune valeur stockée</text><text x="394" y="160" class="p" font-size="12">· n’occupe rien du tout</text><text x="394" y="184" class="p" font-size="12">· se recalcule à chaque clic</text><text x="394" y="208" class="p" font-size="12">· utilisable UNIQUEMENT en valeurs</text><text x="394" y="232" class="p" font-size="12">· quand il faut AGRÉGER</text><text x="394" y="266" class="mono vtext" font-size="10.5">CA USD, Marge %, Clients actifs</text><rect x="24" y="304" width="656" height="98" rx="6" class="vfill"/><rect x="24" y="304" width="656" height="98" rx="6" class="bord"/><text x="44" y="330" class="h" font-size="13.5">La question qui tranche, en une phrase</text><text x="44" y="356" class="p" font-size="12.5">« Est-ce que j’ai besoin de METTRE ÇA EN LIGNE dans un tableau croisé ? »</text><text x="44" y="380" class="mono vtext" font-size="11.5">Oui → colonne calculée.   Non → mesure. Et dans le doute, c’est une mesure.</text></svg>