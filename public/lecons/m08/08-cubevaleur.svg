<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 444" width="704" height="444" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="444" rx="8" class="fond"/><text x="24" y="30" class="eti">Sortir du carcan du tableau croisé</text><rect x="24" y="52" width="330" height="178" rx="6" class="carte"/><rect x="24" y="52" width="330" height="178" rx="6" class="bord"/><text x="44" y="78" class="h" font-size="14">Le tableau croisé</text><rect x="44" y="94" width="260" height="104" rx="3" class="carte"/><rect x="44" y="94" width="260" height="26" rx="3" class="vfill"/><text x="53" y="111.0" class="mono" font-size="10.5" fill="var(--t2)">Agence</text><text x="183" y="111.0" class="mono" font-size="10.5" fill="var(--t2)">CA USD</text><line x1="44" y1="94" x2="304" y2="94" class="bord2"/><line x1="44" y1="120" x2="304" y2="120" class="bord2"/><line x1="44" y1="146" x2="304" y2="146" class="bord2"/><line x1="44" y1="172" x2="304" y2="172" class="bord2"/><line x1="44" y1="198" x2="304" y2="198" class="bord2"/><line x1="44" y1="94" x2="44" y2="198" class="bord2"/><line x1="174" y1="94" x2="174" y2="198" class="bord2"/><line x1="304" y1="94" x2="304" y2="198" class="bord2"/><text x="53" y="137.0" class="mono t" font-size="11">Kinshasa</text><text x="183" y="137.0" class="mono t3" font-size="11">8 131 116</text><text x="53" y="163.0" class="mono t" font-size="11">Abidjan</text><text x="183" y="163.0" class="mono t3" font-size="11">5 293 440</text><text x="53" y="189.0" class="mono t" font-size="11">Dakar</text><text x="183" y="189.0" class="mono t3" font-size="11">3 728 904</text><rect x="44" y="94" width="260" height="104" rx="3" class="bord"/><text x="44" y="214" class="mono t3" font-size="11">Sa forme dépend de ses données.</text><rect x="374" y="52" width="306" height="178" rx="6" class="vfill"/><rect x="374" y="52" width="306" height="178" rx="6" class="bord"/><text x="394" y="78" class="h" font-size="14">La même chose en CUBEVALEUR</text><text x="394" y="106" class="mono vtext" font-size="11">=CUBEVALEUR(</text><text x="394" y="124" class="mono vtext" font-size="11">  &quot;ThisWorkbookDataModel&quot;;</text><text x="394" y="142" class="mono vtext" font-size="11">  &quot;[Measures].[CA USD]&quot;;</text><text x="394" y="160" class="mono vtext" font-size="11">  &quot;[d_Agence].[Agence].&amp;[Kinshasa]&quot;)</text><text x="394" y="192" class="p" font-size="12">Une cellule. N’importe où.</text><text x="394" y="212" class="p" font-size="12">La mise en page est à vous.</text><rect x="24" y="248" width="656" height="106" rx="6" class="carte"/><rect x="24" y="248" width="656" height="106" rx="6" class="bord"/><text x="44" y="274" class="h" font-size="13.5">Comment on les obtient sans les écrire</text><text x="44" y="300" class="p" font-size="12.5">Faire le TCD d’abord, puis : Analyse du TCD &gt; Outils OLAP &gt; Convertir en formules.</text><text x="44" y="322" class="p" font-size="12.5">Excel remplace chaque cellule du tableau par son CUBEVALEUR. Il n’y a plus qu’à</text><text x="44" y="342" class="p" font-size="12.5">déplacer les cellules où l’on veut.</text><rect x="24" y="370" width="656" height="56" rx="6" class="vfill"/><rect x="24" y="370" width="656" height="56" rx="6" class="bord"/><text x="44" y="404" class="p" font-size="12.5">C’est le tableau de bord du module 6, alimenté par un modèle d’un million de lignes.</text></svg>