<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 416" width="704" height="416" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="416" rx="8" class="fond"/><text x="24" y="30" class="eti">Une mesure ne connaît pas sa valeur : elle connaît son contexte</text><text x="24" y="58" class="h" font-size="13.5">Le même [CA USD], quatre fois, dans le même tableau</text><rect x="24" y="76" width="642" height="150" rx="3" class="carte"/><rect x="24" y="76" width="642" height="30" rx="3" class="vfill"/><text x="33" y="95.0" class="mono" font-size="10.5" fill="var(--t2)">Agence</text><text x="247" y="95.0" class="mono" font-size="10.5" fill="var(--t2)">2025</text><text x="461" y="95.0" class="mono" font-size="10.5" fill="var(--t2)">2026</text><line x1="24" y1="76" x2="666" y2="76" class="bord2"/><line x1="24" y1="106" x2="666" y2="106" class="bord2"/><line x1="24" y1="136" x2="666" y2="136" class="bord2"/><line x1="24" y1="166" x2="666" y2="166" class="bord2"/><line x1="24" y1="196" x2="666" y2="196" class="bord2"/><line x1="24" y1="226" x2="666" y2="226" class="bord2"/><line x1="24" y1="76" x2="24" y2="226" class="bord2"/><line x1="238" y1="76" x2="238" y2="226" class="bord2"/><line x1="452" y1="76" x2="452" y2="226" class="bord2"/><line x1="666" y1="76" x2="666" y2="226" class="bord2"/><rect x="452" y="76" width="214" height="60" class="vstroke" stroke-width="2" rx="2"/><text x="33" y="125.0" class="mono t" font-size="11">Kinshasa</text><text x="247" y="125.0" class="mono t3" font-size="11">7 465 210</text><text x="461" y="125.0" class="mono vtext" font-size="11">8 131 116</text><text x="33" y="155.0" class="mono t" font-size="11">Abidjan</text><text x="247" y="155.0" class="mono t3" font-size="11">4 602 887</text><text x="461" y="155.0" class="mono t3" font-size="11">5 293 440</text><text x="33" y="185.0" class="mono t" font-size="11">Dakar</text><text x="247" y="185.0" class="mono t3" font-size="11">3 401 118</text><text x="461" y="185.0" class="mono t3" font-size="11">3 728 904</text><text x="33" y="215.0" class="mono t" font-size="11">Total</text><text x="247" y="215.0" class="mono t" font-size="11">27 852 544</text><text x="461" y="215.0" class="mono t" font-size="11">30 317 123</text><rect x="24" y="76" width="642" height="150" rx="3" class="bord"/><text x="24" y="246" class="mono t3" font-size="11">Une seule mesure est écrite. Douze valeurs sont calculées.</text><rect x="24" y="268" width="330" height="128" rx="6" class="vfill"/><rect x="24" y="268" width="330" height="128" rx="6" class="bord"/><text x="44" y="294" class="h" font-size="13">Ce que voit la mesure en haut</text><text x="44" y="320" class="mono vtext" font-size="11.5">Agence = Kinshasa</text><text x="44" y="340" class="mono vtext" font-size="11.5">Année = 2026</text><text x="44" y="372" class="p" font-size="12">Elle somme ce qui reste après</text><text x="44" y="390" class="p" font-size="12">ces deux filtres. C’est tout.</text><rect x="374" y="268" width="306" height="128" rx="6" class="carte"/><rect x="374" y="268" width="306" height="128" rx="6" class="bord"/><text x="394" y="294" class="h" font-size="13">CALCULATE change le contexte</text><text x="394" y="320" class="mono t" font-size="11">CALCULATE ( [CA USD] ;</text><text x="394" y="338" class="mono t" font-size="11">  ALL ( d_Agence ) )</text><text x="394" y="370" class="p" font-size="12">retire le filtre d’agence :</text><text x="394" y="388" class="p" font-size="11.5">on obtient le total, sur chaque ligne.</text></svg>