</style><rect width="704" height="522" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">Le classeur invisible qu’Excel ouvre à chaque démarrage</text><rect x="232" y="56" width="240" height="96" rx="6" class="vfill"/><rect x="232" y="56" width="240" height="96" rx="6" class="bord"/><text x="352" y="88" class="h" font-size="15" text-anchor="middle">PERSONAL.XLSB</text><text x="352" y="110" class="p" font-size="12" text-anchor="middle">vos dix macros utiles</text><text x="352" y="132" class="mono t3" font-size="10" text-anchor="middle">jamais visible, toujours ouvert</text><rect x="24" y="236" width="158" height="62" rx="6" class="carte"/><rect x="24" y="236" width="158" height="62" rx="6" class="bord"/><text x="103" y="262" class="h" font-size="12" text-anchor="middle">Budget_2027.xlsx</text><text x="103" y="282" class="mono t3" font-size="9.5" text-anchor="middle">vos macros y sont</text><path d="M 352 152 C 352 190, 103 190, 103 236" stroke="var(--vb)" stroke-width="1.6" fill="none"/><circle cx="103" cy="236" r="3.5" fill="var(--vb)"/><rect x="190" y="236" width="158" height="62" rx="6" class="carte"/><rect x="190" y="236" width="158" height="62" rx="6" class="bord"/><text x="269" y="262" class="h" font-size="12" text-anchor="middle">Caisse_sept.xlsx</text><text x="269" y="282" class="mono t3" font-size="9.5" text-anchor="middle">vos macros y sont</text><path d="M 352 152 C 352 190, 269 190, 269 236" stroke="var(--vb)" stroke-width="1.6" fill="none"/><circle cx="269" cy="236" r="3.5" fill="var(--vb)"/><rect x="356" y="236" width="158" height="62" rx="6" class="carte"/><rect x="356" y="236" width="158" height="62" rx="6" class="bord"/><text x="435" y="262" class="h" font-size="12" text-anchor="middle">Clients.xlsx</text><text x="435" y="282" class="mono t3" font-size="9.5" text-anchor="middle">vos macros y sont</text><path d="M 352 152 C 352 190, 435 190, 435 236" stroke="var(--vb)" stroke-width="1.6" fill="none"/><circle cx="435" cy="236" r="3.5" fill="var(--vb)"/><rect x="522" y="236" width="158" height="62" rx="6" class="carte"/><rect x="522" y="236" width="158" height="62" rx="6" class="bord"/><text x="601" y="262" class="h" font-size="12" text-anchor="middle">BP_Bamako.xlsx</text><text x="601" y="282" class="mono t3" font-size="9.5" text-anchor="middle">vos macros y sont</text><path d="M 352 152 C 352 190, 601 190, 601 236" stroke="var(--vb)" stroke-width="1.6" fill="none"/><circle cx="601" cy="236" r="3.5" fill="var(--vb)"/><rect x="24" y="322" width="656" height="108" rx="6" class="carte"/><rect x="24" y="322" width="656" height="108" rx="6" class="bord"/><text x="44" y="348" class="h" font-size="13.5">Comment il naît, en quatre gestes</text><text x="44" y="374" class="mono t2" font-size="11.5">1.  Développeur &gt; Enregistrer une macro</text><text x="44" y="394" class="mono t2" font-size="11.5">2.  « Enregistrer dans » : Classeur de macros personnelles</text><text x="44" y="414" class="mono t2" font-size="11.5">3.  Faire n’importe quoi, arrêter l’enregistrement</text><text x="44" y="434" class="mono t2" font-size="11.5">4.  Fermer Excel, répondre OUI à « enregistrer PERSONAL.XLSB »</text><rect x="24" y="444" width="656" height="58" rx="6" class="vfill"/><rect x="24" y="444" width="656" height="58" rx="6" class="bord"/><text x="44" y="470" class="p" font-size="12.5">Il existe depuis Excel 97. Presque personne ne le sait, et c’est la chose la plus</text><text x="44" y="490" class="p" font-size="12.5">rentable de ce module — dix minutes, une fois, pour toutes vos années à venir.</text></svg>