<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 528" width="704" height="528" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="528" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">Les huit niveaux — la fin du programme</text><rect x="24" y="52" width="656" height="38" rx="6" class="carte"/><rect x="24" y="52" width="656" height="38" rx="6" class="bord"/><circle cx="52" cy="71" r="13" class="vfill"/><circle cx="52" cy="71" r="13" class="vstroke"/><text x="52" y="76" class="vtext mono" font-size="12.5" font-weight="600" text-anchor="middle">1</text><text x="80" y="76" class="h" font-size="13">Je le fais à la main</text><text x="622" y="76" class="mono t3" font-size="10.5" text-anchor="end">Mise à niveau</text><path d="M 640 66 L 646 74 L 658 60" stroke="var(--v)" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="24" y="98" width="656" height="38" rx="6" class="carte"/><rect x="24" y="98" width="656" height="38" rx="6" class="bord"/><circle cx="52" cy="117" r="13" class="vfill"/><circle cx="52" cy="117" r="13" class="vstroke"/><text x="52" y="122" class="vtext mono" font-size="12.5" font-weight="600" text-anchor="middle">2</text><text x="80" y="122" class="h" font-size="13">Je le fais avec une formule</text><text x="622" y="122" class="mono t3" font-size="10.5" text-anchor="end">M1</text><path d="M 640 112 L 646 120 L 658 106" stroke="var(--v)" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="24" y="144" width="656" height="38" rx="6" class="carte"/><rect x="24" y="144" width="656" height="38" rx="6" class="bord"/><circle cx="52" cy="163" r="13" class="vfill"/><circle cx="52" cy="163" r="13" class="vstroke"/><text x="52" y="168" class="vtext mono" font-size="12.5" font-weight="600" text-anchor="middle">3</text><text x="80" y="168" class="h" font-size="13">Je rends la formule dynamique</text><text x="622" y="168" class="mono t3" font-size="10.5" text-anchor="end">M1 · M4</text><path d="M 640 158 L 646 166 L 658 152" stroke="var(--v)" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="24" y="190" width="656" height="38" rx="6" class="carte"/><rect x="24" y="190" width="656" height="38" rx="6" class="bord"/><circle cx="52" cy="209" r="13" class="vfill"/><circle cx="52" cy="209" r="13" class="vstroke"/><text x="52" y="214" class="vtext mono" font-size="12.5" font-weight="600" text-anchor="middle">4</text><text x="80" y="214" class="h" font-size="13">J’automatise dans Excel</text><text x="622" y="214" class="mono t3" font-size="10.5" text-anchor="end">M5 · M6</text><path d="M 640 204 L 646 212 L 658 198" stroke="var(--v)" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="24" y="236" width="656" height="38" rx="6" class="carte"/><rect x="24" y="236" width="656" height="38" rx="6" class="bord"/><circle cx="52" cy="255" r="13" class="vfill"/><circle cx="52" cy="255" r="13" class="vstroke"/><text x="52" y="260" class="vtext mono" font-size="12.5" font-weight="600" text-anchor="middle">5</text><text x="80" y="260" class="h" font-size="13">J’industrialise</text><text x="622" y="260" class="mono t3" font-size="10.5" text-anchor="end">M7 · M8</text><path d="M 640 250 L 646 258 L 658 244" stroke="var(--v)" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="24" y="282" width="656" height="38" rx="6" class="carte"/><rect x="24" y="282" width="656" height="38" rx="6" class="bord"/><circle cx="52" cy="301" r="13" class="vfill"/><circle cx="52" cy="301" r="13" class="vstroke"/><text x="52" y="306" class="vtext mono" font-size="12.5" font-weight="600" text-anchor="middle">6</text><text x="80" y="306" class="h" font-size="13">Je fais raisonner l’IA avec moi</text><text x="622" y="306" class="mono t3" font-size="10.5" text-anchor="end">tous</text><path d="M 640 296 L 646 304 L 658 290" stroke="var(--v)" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="24" y="328" width="656" height="38" rx="6" class="carte"/><rect x="24" y="328" width="656" height="38" rx="6" class="bord"/><circle cx="52" cy="347" r="13" class="vfill"/><circle cx="52" cy="347" r="13" class="vstroke"/><text x="52" y="352" class="vtext mono" font-size="12.5" font-weight="600" text-anchor="middle">7</text><text x="80" y="352" class="h" font-size="13">Claude Code automatise le flux</text><text x="622" y="352" class="mono t3" font-size="10.5" text-anchor="end">M10</text><path d="M 640 342 L 646 350 L 658 336" stroke="var(--v)" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="24" y="374" width="656" height="38" rx="6" class="vfill"/><rect x="24" y="374" width="656" height="38" rx="6" class="bord"/><circle cx="52" cy="393" r="13" class="vfill"/><circle cx="52" cy="393" r="13" class="vstroke"/><text x="52" y="398" class="vtext mono" font-size="12.5" font-weight="600" text-anchor="middle">8</text><text x="80" y="398" class="h" font-size="13.5">Je contrôle, je valide, j’assume</text><text x="622" y="398" class="mono t3" font-size="10.5" text-anchor="end">tous</text><path d="M 640 388 L 646 396 L 658 382" stroke="var(--v)" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="24" y="424" width="656" height="84" rx="6" class="carte"/><rect x="24" y="424" width="656" height="84" rx="6" class="bord"/><text x="44" y="452" class="h" font-size="14.5">Le niveau 8 n’est pas au-dessus de l’IA.</text><text x="44" y="478" class="p" font-size="12.5">Il en est la condition. Une sortie que personne ne vérifie n’est pas un gain de temps :</text><text x="44" y="498" class="p" font-size="12.5">c’est un risque qu’on a déplacé, et qu’on ne voit plus.</text></svg>