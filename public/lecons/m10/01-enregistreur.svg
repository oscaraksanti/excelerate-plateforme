<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 474" width="704" height="474" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="474" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">Le bouton que personne ne remarque, et qui décide de tout</text><rect x="24" y="52" width="320" height="214" rx="6" class="carte"/><rect x="24" y="52" width="320" height="214" rx="6" class="bord"/><text x="44" y="80" class="h" font-size="14.5">Références absolues</text><text x="44" y="102" class="mono t3" font-size="10.5">réglage par défaut</text><text x="44" y="134" class="p" font-size="12.5">La macro rejoue les MÊMES cellules,</text><text x="44" y="156" class="p" font-size="12.5">quel que soit l’endroit où</text><text x="44" y="178" class="p" font-size="12.5">vous êtes au moment de la lancer.</text><rect x="44" y="200" width="280" height="26" rx="3" class="fond"/><text x="56" y="218" class="mono" font-size="10.5" fill="var(--t2)">Range(&quot;B4&quot;).Select</text><text x="44" y="250" class="mono t3" font-size="11">B4. Toujours B4.</text><rect x="360" y="52" width="320" height="214" rx="6" class="vfill"/><rect x="360" y="52" width="320" height="214" rx="6" class="bord"/><text x="380" y="80" class="h" font-size="14.5">Références relatives</text><text x="380" y="102" class="mono t3" font-size="10.5">à activer avant d’enregistrer</text><text x="380" y="134" class="p" font-size="12.5">La macro rejoue les mêmes DÉPLACEMENTS,</text><text x="380" y="156" class="p" font-size="12.5">à partir de la cellule</text><text x="380" y="178" class="p" font-size="12.5">sélectionnée au lancement.</text><rect x="380" y="200" width="280" height="26" rx="3" class="fond"/><text x="392" y="218" class="mono" font-size="10.5" fill="var(--t2)">ActiveCell.Offset(0, 1).Select</text><text x="380" y="250" class="mono t3" font-size="11">Une colonne à droite. D’où qu’on parte.</text><rect x="24" y="286" width="656" height="96" rx="6" class="carte"/><rect x="24" y="286" width="656" height="96" rx="6" class="bord"/><text x="44" y="312" class="h" font-size="13.5">Le test qui tranche, avant d’appuyer sur Enregistrer</text><text x="44" y="338" class="p" font-size="12.5">« Est-ce que je referai ce geste ailleurs, sur d’autres lignes ? »  Oui → relatives.</text><text x="44" y="360" class="p" font-size="12.5">« Est-ce que ça touche toujours les mêmes cellules ? »  Oui → absolues.</text><rect x="24" y="396" width="656" height="58" rx="6" class="rfill"/><rect x="24" y="396" width="656" height="58" rx="6" class="bord"/><text x="44" y="422" class="p" font-size="12.5">Le réglage se choisit AVANT d’enregistrer. Après, il est trop tard :</text><text x="44" y="442" class="p" font-size="12.5">il faut réenregistrer la macro en entier.</text></svg>