<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 532" width="704" height="532" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="532" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">La même boucle, dans les deux sens</text><rect x="24" y="52" width="320" height="366" rx="6" class="rfill"/><rect x="24" y="52" width="320" height="366" rx="6" class="bord"/><text x="44" y="80" class="h" font-size="14">❌  For i = 1 To 8</text><text x="44" y="102" class="mono t3" font-size="10.5">on descend</text><rect x="44" y="120" width="222" height="23" rx="3" class="fond"/><text x="54" y="137" class="mono t3" font-size="10">1</text><text x="80" y="137" class="mono" font-size="10.5" fill="var(--t2)">Kinshasa</text><rect x="44" y="146" width="222" height="23" rx="3" class="fond"/><text x="54" y="163" class="mono t3" font-size="10">2</text><text x="80" y="163" class="mono" font-size="10.5" fill="var(--t2)">(vide)</text><text x="214" y="163" class="mono ok" font-size="10">supprimée</text><rect x="44" y="172" width="222" height="23" rx="3" class="fond"/><text x="54" y="189" class="mono t3" font-size="10">3</text><text x="80" y="189" class="mono" font-size="10.5" fill="var(--t2)">(vide)</text><text x="214" y="189" class="mono ko" font-size="10">survit</text><rect x="44" y="198" width="222" height="23" rx="3" class="fond"/><text x="54" y="215" class="mono t3" font-size="10">4</text><text x="80" y="215" class="mono" font-size="10.5" fill="var(--t2)">Dakar</text><rect x="44" y="224" width="222" height="23" rx="3" class="fond"/><text x="54" y="241" class="mono t3" font-size="10">5</text><text x="80" y="241" class="mono" font-size="10.5" fill="var(--t2)">(vide)</text><text x="214" y="241" class="mono ok" font-size="10">supprimée</text><rect x="44" y="250" width="222" height="23" rx="3" class="fond"/><text x="54" y="267" class="mono t3" font-size="10">6</text><text x="80" y="267" class="mono" font-size="10.5" fill="var(--t2)">Douala</text><rect x="44" y="276" width="222" height="23" rx="3" class="fond"/><text x="54" y="293" class="mono t3" font-size="10">7</text><text x="80" y="293" class="mono" font-size="10.5" fill="var(--t2)">(vide)</text><text x="214" y="293" class="mono ok" font-size="10">supprimée</text><rect x="44" y="302" width="222" height="23" rx="3" class="fond"/><text x="54" y="319" class="mono t3" font-size="10">8</text><text x="80" y="319" class="mono" font-size="10.5" fill="var(--t2)">(vide)</text><text x="214" y="319" class="mono ko" font-size="10">survit</text><text x="44" y="354" class="mono ko" font-size="11">Deux lignes vides sur cinq survivent.</text><text x="44" y="376" class="p" font-size="12">Supprimer la 2 fait remonter la 3,</text><text x="44" y="396" class="p" font-size="12">que la boucle a déjà dépassée.</text><rect x="360" y="52" width="320" height="366" rx="6" class="vfill"/><rect x="360" y="52" width="320" height="366" rx="6" class="bord"/><text x="380" y="80" class="h" font-size="14">✅  For i = 8 To 1 Step -1</text><text x="380" y="102" class="mono t3" font-size="10.5">on remonte</text><rect x="380" y="120" width="222" height="23" rx="3" class="fond"/><text x="390" y="137" class="mono t3" font-size="10">1</text><text x="416" y="137" class="mono" font-size="10.5" fill="var(--t2)">Kinshasa</text><rect x="380" y="146" width="222" height="23" rx="3" class="fond"/><text x="390" y="163" class="mono t3" font-size="10">2</text><text x="416" y="163" class="mono" font-size="10.5" fill="var(--t2)">(vide)</text><text x="550" y="163" class="mono ok" font-size="10">supprimée</text><rect x="380" y="172" width="222" height="23" rx="3" class="fond"/><text x="390" y="189" class="mono t3" font-size="10">3</text><text x="416" y="189" class="mono" font-size="10.5" fill="var(--t2)">(vide)</text><text x="550" y="189" class="mono ok" font-size="10">supprimée</text><rect x="380" y="198" width="222" height="23" rx="3" class="fond"/><text x="390" y="215" class="mono t3" font-size="10">4</text><text x="416" y="215" class="mono" font-size="10.5" fill="var(--t2)">Dakar</text><rect x="380" y="224" width="222" height="23" rx="3" class="fond"/><text x="390" y="241" class="mono t3" font-size="10">5</text><text x="416" y="241" class="mono" font-size="10.5" fill="var(--t2)">(vide)</text><text x="550" y="241" class="mono ok" font-size="10">supprimée</text><rect x="380" y="250" width="222" height="23" rx="3" class="fond"/><text x="390" y="267" class="mono t3" font-size="10">6</text><text x="416" y="267" class="mono" font-size="10.5" fill="var(--t2)">Douala</text><rect x="380" y="276" width="222" height="23" rx="3" class="fond"/><text x="390" y="293" class="mono t3" font-size="10">7</text><text x="416" y="293" class="mono" font-size="10.5" fill="var(--t2)">(vide)</text><text x="550" y="293" class="mono ok" font-size="10">supprimée</text><rect x="380" y="302" width="222" height="23" rx="3" class="fond"/><text x="390" y="319" class="mono t3" font-size="10">8</text><text x="416" y="319" class="mono" font-size="10.5" fill="var(--t2)">(vide)</text><text x="550" y="319" class="mono ok" font-size="10">supprimée</text><text x="380" y="354" class="mono ok" font-size="11">Les cinq lignes vides partent.</text><text x="380" y="376" class="p" font-size="12">Supprimer la 8 ne déplace rien</text><text x="380" y="396" class="p" font-size="12">de ce qui est au-dessus.</text><rect x="24" y="436" width="656" height="76" rx="6" class="carte"/><rect x="24" y="436" width="656" height="76" rx="6" class="bord"/><text x="44" y="462" class="h" font-size="13.5">Step -1 est toute la correction</text><text x="44" y="488" class="p" font-size="12.5">C’est l’erreur que l’IA écrit presque à chaque fois — et elle ne se voit jamais sur un</text><text x="44" y="508" class="p" font-size="12.5">jeu de test de trois lignes.</text></svg>