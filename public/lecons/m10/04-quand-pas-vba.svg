<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 570" width="704" height="570" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="570" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">L’ordre des outils — on descend, on ne remonte jamais</text><rect x="24" y="52" width="656" height="70" rx="6" class="vfill"/><rect x="24" y="52" width="656" height="70" rx="6" class="bord"/><text x="44" y="74" class="mono t3" font-size="10.5">1</text><text x="72" y="78" class="h" font-size="14">Une formule</text><text x="72" y="100" class="p" font-size="12">SOMME.SI.ENS, RECHERCHEX, LET</text><text x="656" y="100" class="mono t3" font-size="10.5" text-anchor="end">se relit, se corrige</text><path d="M 352 122 L 352 134" stroke="var(--b)" stroke-width="2"/><rect x="24" y="134" width="656" height="70" rx="6" class="vfill"/><rect x="24" y="134" width="656" height="70" rx="6" class="bord"/><text x="44" y="156" class="mono t3" font-size="10.5">2</text><text x="72" y="160" class="h" font-size="14">Power Query</text><text x="72" y="182" class="p" font-size="12">importer, nettoyer, dépivoter</text><text x="656" y="182" class="mono t3" font-size="10.5" text-anchor="end">s’actualise d’un clic</text><path d="M 352 204 L 352 216" stroke="var(--b)" stroke-width="2"/><rect x="24" y="216" width="656" height="70" rx="6" class="carte"/><rect x="24" y="216" width="656" height="70" rx="6" class="bord"/><text x="44" y="238" class="mono t3" font-size="10.5">3</text><text x="72" y="242" class="h" font-size="14">Le modèle de données</text><text x="72" y="264" class="p" font-size="12">relations, mesures DAX</text><text x="656" y="264" class="mono t3" font-size="10.5" text-anchor="end">quand une feuille ne suffit plus</text><path d="M 352 286 L 352 298" stroke="var(--b)" stroke-width="2"/><rect x="24" y="298" width="656" height="70" rx="6" class="carte"/><rect x="24" y="298" width="656" height="70" rx="6" class="bord"/><text x="44" y="320" class="mono t3" font-size="10.5">4</text><text x="72" y="324" class="h" font-size="14">VBA</text><text x="72" y="346" class="p" font-size="12">exporter, nommer, déclencher</text><text x="656" y="346" class="mono t3" font-size="10.5" text-anchor="end">seulement ici — et commenté</text><path d="M 352 368 L 352 380" stroke="var(--b)" stroke-width="2"/><rect x="24" y="380" width="656" height="70" rx="6" class="carte"/><rect x="24" y="380" width="656" height="70" rx="6" class="bord"/><text x="44" y="402" class="mono t3" font-size="10.5">5</text><text x="72" y="406" class="h" font-size="14">Claude Code</text><text x="72" y="428" class="p" font-size="12">deux cents fichiers, une commande</text><text x="656" y="428" class="mono t3" font-size="10.5" text-anchor="end">quand le travail sort d’Excel</text><rect x="24" y="468" width="656" height="82" rx="6" class="rfill"/><rect x="24" y="468" width="656" height="82" rx="6" class="bord"/><text x="44" y="494" class="h" font-size="13.5">La règle, et elle ne se négocie pas</text><text x="44" y="520" class="p" font-size="12.5">Si le niveau du dessus sait le faire, il gagne. Une macro qui refait ce que Power Query</text><text x="44" y="540" class="p" font-size="12.5">fait déjà est une dette, pas une automatisation.</text></svg>