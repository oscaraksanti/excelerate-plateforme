<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 492" width="704" height="492" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="492" rx="8" class="fond"/><style>.ok{fill:#15803d}.ko{fill:#c0392b}.bl{fill:#1d4ed8}@media (prefers-color-scheme: dark){.ok{fill:#5fd68f}.ko{fill:#f87171}.bl{fill:#8ab4ff}}</style><text x="24" y="30" class="eti">Exporter vers Google Sheets : ce qui passe, ce qui meurt</text><rect x="24" y="52" width="320" height="226" rx="6" class="vfill"/><rect x="24" y="52" width="320" height="226" rx="6" class="bord"/><text x="44" y="80" class="h" font-size="14.5">Ce qui survit</text><text x="44" y="110" class="h" font-size="12.5">Formules classiques</text><text x="44" y="128" class="p" font-size="11.5">SOMME.SI.ENS, RECHERCHEV, SI</text><text x="44" y="152" class="h" font-size="12.5">Mise en forme conditionnelle</text><text x="44" y="170" class="p" font-size="11.5">la plupart des règles</text><text x="44" y="194" class="h" font-size="12.5">Tableaux croisés dynamiques</text><text x="44" y="212" class="p" font-size="11.5">refaits, mais équivalents</text><text x="44" y="236" class="h" font-size="12.5">Validation de données</text><text x="44" y="254" class="p" font-size="11.5">listes déroulantes</text><rect x="360" y="52" width="320" height="226" rx="6" class="rfill"/><rect x="360" y="52" width="320" height="226" rx="6" class="bord"/><text x="380" y="80" class="h" font-size="14.5">Ce qui meurt</text><text x="380" y="110" class="h" font-size="12.5">Power Query</text><text x="380" y="128" class="p" font-size="11.5">aucun équivalent — la requête disparaît</text><text x="380" y="152" class="h" font-size="12.5">Le modèle de données</text><text x="380" y="170" class="p" font-size="11.5">et tout le DAX avec</text><text x="380" y="194" class="h" font-size="12.5">Les matrices dynamiques</text><text x="380" y="212" class="p" font-size="11.5">FILTRE, TRIER, UNIQUE ne passent pas</text><text x="380" y="236" class="h" font-size="12.5">Les macros VBA</text><text x="380" y="254" class="p" font-size="11.5">Sheets utilise Apps Script, un autre langage</text><rect x="24" y="296" width="656" height="98" rx="6" class="carte"/><rect x="24" y="296" width="656" height="98" rx="6" class="bord"/><text x="44" y="322" class="h" font-size="13.5">💎  QUERY() — ce que Sheets fait mieux</text><rect x="44" y="336" width="616" height="26" rx="3" class="carte"/><text x="56" y="354" class="mono bl" font-size="11">=QUERY(A:F ; "select D, sum(F) where B='Kinshasa' group by D order by sum(F) desc" ; 1)</text><text x="44" y="384" class="p" font-size="12.5">Un tableau croisé dynamique, en une formule, qui se recalcule. Excel n’a pas d’équivalent.</text><rect x="24" y="410" width="656" height="62" rx="6" class="vfill"/><rect x="24" y="410" width="656" height="62" rx="6" class="bord"/><text x="44" y="436" class="h" font-size="13.5">La question à poser avant d’exporter</text><text x="44" y="458" class="p" font-size="12.5">« Qui va s’en servir, et avec quoi ? »  La réponse décide, pas la préférence.</text></svg>