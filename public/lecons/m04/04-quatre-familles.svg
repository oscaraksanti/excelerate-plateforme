<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 496" width="704" height="496" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="496" rx="8" class="fond"/><text x="24" y="30" class="eti">Un rapprochement ne rend pas un chiffre. Il rend quatre listes.</text><rect x="24" y="54" width="656" height="76" rx="6" class="vfill"/><rect x="24" y="54" width="656" height="76" rx="6" class="vstroke" stroke-width="2"/><text x="44" y="80" class="mono t3" font-size="10.5" letter-spacing=".08em">CHEZ A, PAS CHEZ B</text><text x="44" y="102" class="h" font-size="14">Livrée, jamais facturée</text><text x="44" y="120" class="p" font-size="12">de l’argent qu’on n’a pas réclamé</text><text x="660" y="102" text-anchor="end" class="mono" font-size="13" fill="var(--v)" font-weight="600">8 commandes · 84 320 USD</text><rect x="24" y="138" width="656" height="76" rx="6" class="carte"/><rect x="24" y="138" width="656" height="76" rx="6" class="bord" stroke-width="1"/><text x="44" y="164" class="mono t3" font-size="10.5" letter-spacing=".08em">CHEZ B, PAS CHEZ A</text><text x="44" y="186" class="h" font-size="14">Facturée sans commande</text><text x="44" y="204" class="p" font-size="12">une saisie manuelle, ou pire</text><text x="660" y="186" text-anchor="end" class="mono" font-size="13" fill="var(--t2)" font-weight="600">5 factures</text><rect x="24" y="222" width="656" height="76" rx="6" class="carte"/><rect x="24" y="222" width="656" height="76" rx="6" class="bord" stroke-width="1"/><text x="44" y="248" class="mono t3" font-size="10.5" letter-spacing=".08em">DES DEUX CÔTÉS, MONTANTS DIFFÉRENTS</text><text x="44" y="270" class="h" font-size="14">Écart de montant</text><text x="44" y="288" class="p" font-size="12">avoirs, rabais, erreurs de saisie</text><text x="660" y="270" text-anchor="end" class="mono" font-size="13" fill="var(--t2)" font-weight="600">143 commandes</text><rect x="24" y="306" width="656" height="76" rx="6" class="carte"/><rect x="24" y="306" width="656" height="76" rx="6" class="bord" stroke-width="1"/><text x="44" y="332" class="mono t3" font-size="10.5" letter-spacing=".08em">DEUX FOIS DU MÊME CÔTÉ</text><text x="44" y="354" class="h" font-size="14">Facture en double</text><text x="44" y="372" class="p" font-size="12">le logiciel a hoqueté un matin</text><text x="660" y="354" text-anchor="end" class="mono" font-size="13" fill="var(--t2)" font-weight="600">14 factures</text><rect x="24" y="396" width="656" height="76" rx="6" class="carte"/><rect x="24" y="396" width="656" height="76" rx="6" class="bord"/><text x="44" y="422" class="h" font-size="13.5">L’ordre des statuts compte</text><text x="44" y="446" class="mono t3" font-size="11">Non livrée &gt; Livrée non facturée &gt; Facture en double &gt; Écart de montant &gt; Rapprochée</text><text x="44" y="464" class="p" font-size="12">Une commande peut relever de deux familles. Sans priorité écrite, deux personnes comptent deux totaux.</text></svg>