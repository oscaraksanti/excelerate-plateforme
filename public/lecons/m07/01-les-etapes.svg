<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 362" width="704" height="362" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="362" rx="8" class="fond"/><text x="24" y="30" class="eti">Une requête n’est pas un résultat : c’est une recette</text><rect x="24" y="52" width="300" height="290" rx="6" class="carte"/><rect x="24" y="52" width="300" height="290" rx="6" class="bord"/><text x="44" y="78" class="h" font-size="13.5">Étapes appliquées</text><circle cx="52" cy="100" r="4" fill="var(--vb)"/><text x="66" y="104" class="mono vtext" font-size="11">Source — le dossier</text><circle cx="52" cy="129" r="4" fill="var(--vb)"/><text x="66" y="133" class="mono t" font-size="11">Fichiers filtrés</text><circle cx="52" cy="158" r="4" fill="var(--vb)"/><text x="66" y="162" class="mono t" font-size="11">Mois depuis le nom du fichier</text><circle cx="52" cy="187" r="4" fill="var(--vb)"/><text x="66" y="191" class="mono t" font-size="11">Format normalisé</text><circle cx="52" cy="216" r="4" fill="var(--vb)"/><text x="66" y="220" class="mono t" font-size="11">Colonnes choisies par leur nom</text><circle cx="52" cy="245" r="4" fill="var(--vb)"/><text x="66" y="249" class="mono t" font-size="11">Types posés explicitement</text><circle cx="52" cy="274" r="4" fill="var(--vb)"/><text x="66" y="278" class="mono t" font-size="11">Taux joints sur (Mois ; Devise)</text><circle cx="52" cy="303" r="4" fill="var(--vb)"/><text x="66" y="307" class="mono t" font-size="11">Montant USD calculé</text><text x="44" y="336" class="mono t3" font-size="10.5">Chacune se renomme. En français.</text><rect x="348" y="52" width="332" height="138" rx="6" class="vfill"/><rect x="348" y="52" width="332" height="138" rx="6" class="bord"/><text x="368" y="78" class="h" font-size="13.5">Ce qu&#x27;on gagne à les renommer</text><text x="368" y="104" class="p" font-size="12">« Type modifié2 » ne dit rien à personne,</text><text x="368" y="124" class="p" font-size="12">et surtout pas à vous dans six mois.</text><text x="368" y="154" class="p" font-size="12">La requête devient sa propre</text><text x="368" y="174" class="p" font-size="12">documentation. C&#x27;est gratuit.</text><rect x="348" y="204" width="332" height="138" rx="6" class="carte"/><rect x="348" y="204" width="332" height="138" rx="6" class="bord"/><text x="368" y="230" class="h" font-size="13.5">Le mois prochain</text><text x="368" y="256" class="p" font-size="12">On dépose le fichier dans le dossier.</text><text x="368" y="276" class="p" font-size="12">On clique sur Actualiser.</text><text x="368" y="306" class="mono vtext" font-size="11.5">Les huit étapes se rejouent</text><text x="368" y="324" class="mono vtext" font-size="11.5">dans l&#x27;ordre, à l&#x27;identique.</text></svg>