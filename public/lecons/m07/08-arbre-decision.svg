<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 554" width="704" height="554" role="img"><style>
  :root{
    --f:#fbfcfd; --c:#ffffff; --b:#dfe4ea; --b2:#eef1f4;
    --t:#101418; --t2:#4d5765; --t3:#8a94a3;
    --v:#1f9d55; --vf:#e6f6ed; --vb:#7ed4a3;
    --r:#c0392b; --rf:#fdecea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --f:#11151b; --c:#171c24; --b:#2b3340; --b2:#222834;
      --t:#eef1f5; --t2:#a8b2c0; --t3:#6c7686;
      --v:#4ade80; --vf:#13291d; --vb:#2f6b47;
      --r:#f87171; --rf:#2a1719;
    }
  }
  .fond{fill:var(--f)} .carte{fill:var(--c)} .bord{stroke:var(--b);fill:none}
  .bord2{stroke:var(--b2);fill:none}
  text{font-family:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,sans-serif}
  .t{fill:var(--t)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace}
  .eti{font-size:11px;letter-spacing:.11em;text-transform:uppercase;fill:var(--t3);
       font-family:'IBM Plex Mono',ui-monospace,monospace}
  .h{font-size:15px;font-weight:600;fill:var(--t)}
  .p{font-size:13px;fill:var(--t2)}
  .vfill{fill:var(--vf)} .vstroke{stroke:var(--vb);fill:none} .vtext{fill:var(--v)}
  .rfill{fill:var(--rf)} .rtext{fill:var(--r)}
</style><rect width="704" height="554" rx="8" class="fond"/><text x="24" y="30" class="eti">Power Query n’est pas toujours la réponse</text><rect x="24" y="54" width="656" height="58" rx="6" class="rfill"/><rect x="24" y="54" width="656" height="58" rx="6" class="bord"/><text x="44" y="80" class="h" font-size="13">Une seule fois, jamais à refaire</text><text x="44" y="100" class="mono t3" font-size="10.5">monter une requête coûte 45 min</text><text x="392" y="88" class="mono t" font-size="12.5">les formules, ou même à la main</text><rect x="24" y="122" width="656" height="58" rx="6" class="vfill"/><rect x="24" y="122" width="656" height="58" rx="6" class="bord"/><text x="44" y="148" class="h" font-size="13">Tous les mois, mêmes fichiers</text><text x="44" y="168" class="mono t3" font-size="10.5">45 min une fois, puis un clic</text><text x="392" y="156" class="mono vtext" font-size="12.5" font-weight="600">Power Query</text><rect x="24" y="190" width="656" height="58" rx="6" class="carte"/><rect x="24" y="190" width="656" height="58" rx="6" class="bord"/><text x="44" y="216" class="h" font-size="13">Plusieurs tables à relier, millions de lignes</text><text x="44" y="236" class="mono t3" font-size="10.5">module 8 — PQ charge, DAX calcule</text><text x="392" y="224" class="mono t" font-size="12.5">le modèle de données</text><rect x="24" y="258" width="656" height="58" rx="6" class="carte"/><rect x="24" y="258" width="656" height="58" rx="6" class="bord"/><text x="44" y="284" class="h" font-size="13">Mise en page figée, mêmes cellules</text><text x="44" y="304" class="mono t3" font-size="10.5">module 2 — PQ ne met pas en forme</text><text x="392" y="292" class="mono t" font-size="12.5">SOMME.SI.ENS</text><rect x="24" y="326" width="656" height="58" rx="6" class="carte"/><rect x="24" y="326" width="656" height="58" rx="6" class="bord"/><text x="44" y="352" class="h" font-size="13">200 fichiers de formats vraiment différents</text><text x="44" y="372" class="mono t3" font-size="10.5">module 10 — PQ n&#x27;aime pas l&#x27;hétérogène extrême</text><text x="392" y="360" class="mono t" font-size="12.5">un script</text><rect x="24" y="394" width="656" height="58" rx="6" class="rfill"/><rect x="24" y="394" width="656" height="58" rx="6" class="bord"/><text x="44" y="420" class="h" font-size="13">Personne d&#x27;autre ne saura la reprendre</text><text x="44" y="440" class="mono t3" font-size="10.5">une requête non documentée est une dette</text><text x="392" y="428" class="mono t" font-size="12.5">y réfléchir à deux fois</text><rect x="24" y="462" width="656" height="74" rx="6" class="carte"/><rect x="24" y="462" width="656" height="74" rx="6" class="bord"/><text x="44" y="488" class="h" font-size="13.5">Le vrai calcul, et il n&#x27;est pas technique</text><text x="44" y="512" class="p" font-size="12.5">3 h par mois, indéfiniment  →  45 min une fois, puis un clic. Le point d&#x27;équilibre</text><text x="44" y="530" class="p" font-size="12.5">est atteint au bout de deux mois.</text></svg>