l"/><text x="33" y="191.5" class="mono" font-size="10.5" fill="var(--t2)">Respons.</text><text x="126" y="191.5" class="mono" font-size="10.5" fill="var(--t2)">Famille</text><text x="219" y="191.5" class="mono" font-size="10.5" fill="var(--t2)">Agence</text><text x="312" y="191.5" class="mono" font-size="10.5" fill="var(--t2)">Montant</text><text x="405" y="191.5" class="mono" font-size="10.5" fill="var(--t2)">Remise</text><text x="498" y="191.5" class="mono" font-size="10.5" fill="var(--t2)">Devise</text><text x="591" y="191.5" class="mono" font-size="10.5" fill="var(--t2)">Qté</text><line x1="24" y1="174" x2="675" y2="174" class="bord2"/><line x1="24" y1="201" x2="675" y2="201" class="bord2"/><line x1="24" y1="228" x2="675" y2="228" class="bord2"/><line x1="24" y1="174" x2="24" y2="228" class="bord2"/><line x1="117" y1="174" x2="117" y2="228" class="bord2"/><line x1="210" y1="174" x2="210" y2="228" class="bord2"/><line x1="303" y1="174" x2="303" y2="228" class="bord2"/><line x1="396" y1="174" x2="396" y2="228" class="bord2"/><line x1="489" y1="174" x2="489" y2="228" class="bord2"/><line x1="582" y1="174" x2="582" y2="228" class="bord2"/><line x1="675" y1="174" x2="675" y2="228" class="bord2"/><rect x="396" y="174" width="93" height="54" class="vstroke" stroke-width="2" rx="2"/><text x="33" y="218.5" class="mono t3" font-size="11">Nadège K.</text><text x="126" y="218.5" class="mono t3" font-size="11">Riz</text><text x="219" y="218.5" class="mono t" font-size="11">Kinshasa</text><text x="312" y="218.5" class="mono vtext" font-size="11">205 181</text><text x="405" y="218.5" class="mono t3" font-size="11">3 %</text><text x="498" y="218.5" class="mono t3" font-size="11">CDF</text><text x="591" y="218.5" class="mono t3" font-size="11">3 852</text><rect x="24" y="174" width="651" height="54" rx="3" class="bord"/><rect x="24" y="258" width="330" height="132" rx="6" class="rfill"/><rect x="24" y="258" width="330" height="132" rx="6" class="bord"/><text x="44" y="284" class="h" font-size="13.5">Par position</text><text x="44" y="310" class="mono rtext" font-size="11.5">Column5, la cinquième colonne.</text><text x="44" y="336" class="p" font-size="12">En janvier c&#x27;était le montant.</text><text x="44" y="356" class="p" font-size="12">En octobre c&#x27;est la remise.</text><text x="44" y="380" class="mono rtext" font-size="11">Le total est divisé par trente.</text><rect x="374" y="258" width="306" height="132" rx="6" class="vfill"/><rect x="374" y="258" width="306" height="132" rx="6" class="bord"/><text x="394" y="284" class="h" font-size="13.5">Par nom</text><text x="394" y="310" class="mono vtext" font-size="11.5">Table.SelectColumns(…,</text><text x="394" y="328" class="mono vtext" font-size="11.5">  {&quot;Montant_Local&quot;, …})</text><text x="394" y="356" class="p" font-size="12">L&#x27;ordre n&#x27;a plus d&#x27;importance.</text><text x="394" y="380" class="mono vtext" font-size="11">La requête survit.</text><rect x="24" y="406" width="656" height="72" rx="6" class="carte"/><rect x="24" y="406" width="656" height="72" rx="6" class="bord"/><text x="44" y="432" class="h" font-size="13.5">Et si la colonne est renommée, pas déplacée ?</text><text x="44" y="456" class="p" font-size="12.5">Alors la requête s&#x27;arrête, avec une erreur claire. C&#x27;est très préférable à un total faux.</text></svg>